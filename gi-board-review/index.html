<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GI Board Review Course</title>
<style>
  :root{
    --sidebar-bg:#0f1b2d;
    --sidebar-bg-2:#132339;
    --sidebar-text:#aebcd1;
    --sidebar-text-dim:#6b7c94;
    --sidebar-active:#123047;
    --accent:#d0662b;
    --accent-2:#a85320;
    --accent-soft:#fce4d6;
    --bg:#f5f7fa;
    --card:#ffffff;
    --text:#182635;
    --text-muted:#5b6b7f;
    --border:#e3e8ee;
    --established:#1a7f4e;
    --established-bg:#e7f6ee;
    --synth:#a15c00;
    --synth-bg:#fbf0dd;
    --warn:#8a1f11;
    --warn-bg:#fde9e5;
    --built:#a85320;
    --scaffold:#8b95a3;
    --radius:10px;
    --shadow: 0 1px 2px rgba(20,30,45,.06), 0 4px 16px rgba(20,30,45,.06);
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    min-height:100vh;
  }
  a{color:var(--accent-2);}
  #app{display:flex;width:100%;min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:300px;
    flex:0 0 300px;
    background:linear-gradient(180deg,var(--sidebar-bg),var(--sidebar-bg-2));
    color:var(--sidebar-text);
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar-header{
    padding:22px 20px 14px;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:700;font-size:1.15rem;color:#fff;
    text-decoration:none;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:8px;
    background:radial-gradient(circle at 30% 30%, var(--accent), var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-size:.85rem;font-weight:800;color:#fff;flex:0 0 auto;
  }
  .brand-sub{font-size:.72rem;color:var(--sidebar-text-dim);margin-top:4px;letter-spacing:.02em;}

  .overall-progress{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06);}
  .overall-progress .label{display:flex;justify-content:space-between;font-size:.72rem;color:var(--sidebar-text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
  .progress-track{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#f39154);border-radius:99px;transition:width .3s ease;}

  .nav-tree{flex:1;padding:10px 10px 20px;}
  .module-group{margin-bottom:2px;}
  .module-toggle{
    width:100%;display:flex;align-items:center;gap:8px;
    background:none;border:none;color:var(--sidebar-text);
    padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.82rem;font-weight:600;text-align:left;
  }
  .module-toggle:hover{background:rgba(255,255,255,.05);}
  .module-toggle .chev{transition:transform .15s ease;font-size:.7rem;opacity:.6;}
  .module-toggle.open .chev{transform:rotate(90deg);}
  .module-num{
    flex:0 0 auto;width:20px;height:20px;border-radius:6px;
    background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;
    font-size:.68rem;color:#fff;
  }
  .station-list{list-style:none;margin:0;padding:2px 0 8px 30px;display:none;}
  .station-list.open{display:block;}
  .station-list li{margin:1px 0;}
  .station-link{
    display:flex;align-items:center;gap:8px;
    padding:6px 10px;border-radius:7px;text-decoration:none;
    color:var(--sidebar-text);font-size:.78rem;
  }
  .station-link:hover{background:rgba(255,255,255,.06);}
  .station-link.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .dot.built{background:#f39154;box-shadow:0 0 0 3px rgba(243,145,84,.15);}
  .dot.scaffold{background:transparent;border:1.5px solid var(--sidebar-text-dim);}
  .visited-check{margin-left:auto;font-size:.7rem;color:#f39154;opacity:.85;}

  .sidebar-footer{
    padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.06);
    font-size:.74rem;
  }
  .sidebar-footer a{color:var(--sidebar-text);text-decoration:none;display:flex;align-items:center;gap:6px;}
  .sidebar-footer a:hover{color:#fff;}
  .disclaimer-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(220,80,50,.18);color:#ffb199;
    padding:6px 10px;border-radius:99px;font-size:.72rem;font-weight:600;
    margin-bottom:10px;
  }

  /* ---------- MAIN ---------- */
  .content{flex:1;min-width:0;display:flex;flex-direction:column;}
  .top-banner{
    background:var(--warn-bg);color:var(--warn);
    font-size:.8rem;padding:8px 28px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    border-bottom:1px solid #f3cec6;
  }
  .top-banner a{color:var(--warn);font-weight:700;text-decoration:underline;}
  .page{padding:34px 40px 80px;max-width:1080px;width:100%;margin:0 auto;}
  .breadcrumb{font-size:.8rem;color:var(--text-muted);margin-bottom:10px;}
  .breadcrumb a{color:var(--text-muted);text-decoration:none;}
  .breadcrumb a:hover{text-decoration:underline;}

  .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
  .page-title{font-size:1.6rem;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  .page-subtitle{color:var(--text-muted);font-size:.95rem;max-width:640px;}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:99px;font-size:.72rem;font-weight:700;
    letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;
  }
  .badge.built{background:var(--accent-soft);color:var(--accent-2);}
  .badge.scaffold{background:#eef0f3;color:var(--scaffold);}
  .badge.established{background:var(--established-bg);color:var(--established);}
  .badge.synth{background:var(--synth-bg);color:var(--synth);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card + .card{margin-top:16px;}

  /* Tabs */
  .tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;flex-wrap:wrap;}
  .tab-btn{
    background:none;border:none;padding:10px 16px;font-size:.85rem;font-weight:600;
    color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--accent-2);border-bottom-color:var(--accent);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .obj-list{padding-left:20px;line-height:1.85;}
  .obj-list li{margin-bottom:4px;}

  /* Tags */
  .tag{
    display:inline-flex;align-items:center;
    padding:2px 6px;border-radius:4px;font-size:.72rem;
    font-weight:700;text-transform:uppercase;letter-spacing:.02em;
    margin-left:6px;
  }
  .tag.est{background:var(--established-bg);color:var(--established);}
  .tag.syn{background:var(--synth-bg);color:var(--synth);}

  /* Accordion */
  .acc-item{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;}
  .acc-head{
    background:var(--bg);padding:12px 16px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;font-weight:600;
    transition:background .15s ease;
  }
  .acc-head:hover{background:#eef0f3;}
  .acc-head .chev{font-size:.7rem;opacity:.6;transition:transform .15s ease;}
  .acc-item.open .acc-head .chev{transform:rotate(90deg);}
  .acc-body{padding:0 16px;max-height:0;overflow:hidden;transition:all .2s ease;}
  .acc-item.open .acc-body{padding:12px 16px;max-height:2000px;}
  .acc-body p{margin:8px 0;line-height:1.65;color:var(--text-muted);}

  /* Content points */
  .content-point{
    background:var(--accent-soft);
    padding:12px 14px;border-radius:6px;margin:8px 0;
    font-size:.9rem;line-height:1.55;border-left:3px solid var(--accent-2);
  }

  /* Home page */
  .hero{
    background:linear-gradient(135deg,#0f1b2d,#3d4a5c 65%,#d0662b);
    color:#fff;border-radius:14px;padding:36px 38px;margin-bottom:28px;
    position:relative;overflow:hidden;
  }
  .hero h1{margin:0 0 10px;font-size:1.9rem;letter-spacing:-.01em;}
  .hero p{margin:0;color:#eee;max-width:640px;line-height:1.55;font-size:.98rem;}
  .hero .stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap;}
  .stat{background:rgba(255,255,255,.08);border-radius:10px;padding:12px 18px;min-width:140px;}
  .stat .num{font-size:1.5rem;font-weight:800;}
  .stat .lbl{font-size:.72rem;color:#ddd;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  .roadmap{display:flex;flex-direction:column;gap:14px;}
  .rm-module{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
  .rm-module-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .rm-badge{width:34px;height:34px;border-radius:9px;background:var(--sidebar-bg);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex:0 0 auto;}
  .rm-module-head h3{margin:0;font-size:1.05rem;}
  .rm-stations{display:flex;flex-wrap:wrap;gap:8px;}
  .rm-station{
    display:flex;align-items:center;gap:7px;
    border:1px solid var(--border);border-radius:8px;padding:7px 12px;
    text-decoration:none;color:var(--text);font-size:.82rem;
    transition:border-color .15s ease, background .15s ease;
  }
  .rm-station:hover{border-color:var(--accent);background:var(--accent-soft);}
  .rm-station.is-built{border-color:var(--accent);background:var(--accent-soft);font-weight:700;color:var(--accent-2);}
  .rm-station .code{font-weight:700;color:var(--text-muted);}
  .rm-station.is-built .code{color:var(--accent-2);}

  .legend-row{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 8px;font-size:.8rem;color:var(--text-muted);}
  .legend-row .item{display:flex;align-items:center;gap:6px;}

  /* Scaffold box */
  .scaffold-box{
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
    padding:40px 30px;text-align:center;color:var(--text-muted);margin:20px 0;
  }
  .scaffold-box .icon{font-size:3rem;opacity:.5;margin-bottom:16px;}

  /* Prev/next navigation */
  .prevnext{
    display:flex;gap:20px;margin-top:40px;
    justify-content:space-between;flex-wrap:wrap;
  }
  .prevnext a, .prevnext span{
    padding:16px 20px;border-radius:8px;text-decoration:none;
    flex:1;min-width:180px;transition:all .15s ease;
  }
  .prevnext .prev{background:var(--bg);color:var(--text);border:1px solid var(--border);}
  .prevnext .prev:hover{background:var(--accent-soft);border-color:var(--accent);}
  .prevnext .next{background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent);font-weight:600;}
  .prevnext .next:hover{background:var(--accent);color:#fff;}
  .prevnext .lbl{display:block;font-size:.75rem;color:inherit;opacity:.7;margin-bottom:4px;}

  /* Disclaimer page */
  .disclaimer-page h3{font-size:1.1rem;margin-top:20px;margin-bottom:8px;}
  .disclaimer-page p{line-height:1.75;color:var(--text-muted);margin-bottom:12px;}
  .disclaimer-page code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:.9rem;}

  /* Cross-links */
  .cross-link-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:28px 0;}
  .cross-link-tile{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:24px 20px;border:2px solid var(--border);border-radius:12px;
    background:var(--card);text-decoration:none;color:var(--text);
    transition:all .15s ease;text-align:center;
  }
  .cross-link-tile:hover{border-color:var(--accent);background:var(--accent-soft);}
  .cross-link-tile .icon{font-size:2.2rem;}
  .cross-link-tile .title{font-weight:700;font-size:.95rem;}
  .cross-link-tile .desc{font-size:.8rem;color:var(--text-muted);}

  /* Quiz styles */
  .quiz-progress{display:flex;gap:4px;margin-bottom:20px;}
  .quiz-progress .seg{height:4px;flex:1;border-radius:2px;background:var(--border);transition:background .2s;}
  .quiz-progress .seg.done{background:var(--accent);}
  .quiz-progress .seg.current{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .q-stem{font-size:1.05rem;font-weight:600;margin-bottom:18px;line-height:1.55;color:var(--text);}
  .q-options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
  .q-opt{
    display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);
    border-radius:8px;background:var(--card);cursor:pointer;transition:all .15s ease;
    text-align:left;font-size:.9rem;
  }
  .q-opt:hover:not(.disabled){border-color:var(--accent);background:var(--accent-soft);}
  .q-opt.disabled{cursor:default;opacity:.7;}
  .q-opt.correct{border-color:#1a7f4e;background:#e7f6ee;}
  .q-opt.incorrect{border-color:#8a1f11;background:#fde9e5;}
  .q-opt .letter{
    display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
    border-radius:50%;background:var(--bg);font-weight:700;font-size:.85rem;flex:0 0 auto;
  }
  .q-opt.correct .letter{background:#1a7f4e;color:#fff;}
  .q-opt.incorrect .letter{background:#8a1f11;color:#fff;}
  .explain-box{background:var(--accent-soft);padding:14px;border-radius:6px;border-left:3px solid var(--accent);font-size:.9rem;line-height:1.55;}
  .explain-box b{display:block;margin-bottom:6px;}
  .quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;}
  .btn{padding:10px 18px;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:.9rem;transition:all .15s ease;}
  .btn{background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent);}
  .btn:hover{background:var(--accent);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--accent-2);border:1px solid var(--border);}
  .btn.ghost:hover{background:var(--bg);border-color:var(--accent);}
  .quiz-result{text-align:center;padding:40px 30px;}
  .quiz-result .score{font-size:3rem;font-weight:800;color:var(--accent-2);line-height:1;}
  .quiz-result .score-lbl{font-size:.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:24px;}

  /* Checklist styles */
  .chk-summary{display:flex;gap:24px;align-items:center;padding:20px;background:var(--bg);border-radius:8px;margin-bottom:20px;}
  .ring{
    width:80px;height:80px;border-radius:50%;background:conic-gradient(var(--accent) 0deg calc(var(--pct)*3.6deg),var(--border) calc(var(--pct)*3.6deg) 360deg);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700;font-size:1.2rem;color:var(--accent-2);
  }
  .chk-group{margin-bottom:20px;}
  .chk-group h4{font-size:.95rem;font-weight:700;margin:0 0 12px;color:var(--text);}
  .chk-item{display:flex;align-items:flex-start;gap:12px;padding:10px;border-radius:6px;cursor:pointer;transition:background .15s;}
  .chk-item:hover{background:var(--bg);}
  .chk-item input{flex:0 0 auto;margin-top:3px;cursor:pointer;}
  .chk-item span{font-size:.85rem;line-height:1.55;color:var(--text-muted);}

  /* ---------- Added: search, progress detail, nav pills ---------- */
  .nav-search{
    width:100%;margin-top:12px;padding:8px 11px;border-radius:8px;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);
    color:#fff;font-size:.8rem;
  }
  .nav-search::placeholder{color:var(--sidebar-text-dim);}
  .nav-search:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.1);}
  .progress-sub{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:.68rem;color:var(--sidebar-text-dim);}
  .reset-btn{
    background:none;border:none;color:var(--sidebar-text-dim);font-size:.68rem;
    cursor:pointer;text-decoration:underline;padding:0;
  }
  .reset-btn:hover{color:#ffb199;}
  .st-label{flex:1;min-width:0;}
  .score-pill{
    margin-left:auto;background:rgba(243,145,84,.16);color:#f39154;
    font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:99px;flex:0 0 auto;
  }
  .score-pill + .visited-check{margin-left:6px;}

  /* keyboard focus visibility (accessibility) */
  a:focus-visible,button:focus-visible,input:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;
  }

  /* tag legend on the home hero */
  .tag-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:.8rem;color:var(--text-muted);}
  .tag-legend span{display:inline-flex;align-items:center;}

  /* ---------- Mobile menu toggle + backdrop ---------- */
  .menu-toggle{
    display:none;position:fixed;top:10px;left:12px;z-index:60;
    width:42px;height:42px;border-radius:10px;border:none;cursor:pointer;
    background:var(--sidebar-bg);color:#fff;font-size:1.2rem;box-shadow:var(--shadow);
  }
  .nav-backdrop{
    display:none;position:fixed;inset:0;background:rgba(10,18,30,.5);z-index:40;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    .menu-toggle{display:block;}
    .sidebar{
      position:fixed;left:0;top:0;z-index:50;width:290px;flex-basis:290px;
      transform:translateX(-100%);transition:transform .25s ease;
      box-shadow:0 0 40px rgba(0,0,0,.35);
    }
    body.nav-open .sidebar{transform:translateX(0);}
    body.nav-open .nav-backdrop{display:block;}
    .content{width:100%;}
    .top-banner{padding-left:64px;}
    .page{padding:24px 18px 70px;}
    .page-title{font-size:1.3rem;}
  }
  @media (max-width:560px){
    :root{font-size:15px;}
    .page{padding:20px 14px 60px;}
    .tabbar{gap:0;}
    .tab-btn{padding:9px 11px;font-size:.8rem;}
    .prevnext{flex-direction:column;gap:10px;}
    .chk-summary{flex-direction:column;text-align:center;gap:14px;}
    .tag-legend{gap:12px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<button id="menuToggle" class="menu-toggle" aria-label="Toggle navigation menu" aria-controls="app">☰</button>
<div id="navBackdrop" class="nav-backdrop" aria-hidden="true"></div>
<div id="app">
  <nav class="sidebar" aria-label="Course navigation">
    <div class="sidebar-header">
      <a href="#/home" class="brand">
        <div class="brand-mark" aria-hidden="true">🧬</div>
        <div>
          <div>GI Board Review</div>
          <div class="brand-sub">Medical Knowledge & Disease</div>
        </div>
      </a>
      <input id="navSearch" class="nav-search" type="search" placeholder="Search stations…" aria-label="Search stations" autocomplete="off">
    </div>
    <div class="overall-progress">
      <div class="label"><span>Progress</span><span id="progressNum">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
      <div class="progress-sub"><span id="progressLabelText">0/47 visited</span><button id="resetProgress" class="reset-btn" type="button">Reset</button></div>
    </div>
    <div class="nav-tree" id="navTree"></div>
    <div class="sidebar-footer">
      <span class="disclaimer-pill">ℹ️ Design scaffold</span>
      <p style="margin:8px 0;line-height:1.4;font-size:.73rem;">Educational material requiring physician expert review. Not validated medical education.</p>
    </div>
  </nav>
  <div class="content">
    <div class="top-banner">
      ℹ️ This is a <b>design scaffold</b>. Clinical content requires expert gastroenterologist review before use in teaching.
    </div>
    <div class="page" id="page"></div>
  </div>
</div>

<script>
/* =========================================================================
   STATION CONFIG & REGISTRATION
   ========================================================================= */
const STATION_CONFIG = {};
function registerStation(code, cfg){ STATION_CONFIG[code] = cfg; }

/* =========================================================================
   RENDER PANEL BY TYPE (GENERIC)
   ========================================================================= */
function renderPanelByType(tab, grp){
  const open = `<div class="tab-panel" data-group="${grp}" data-tab="${tab.key}">`;
  const close = `</div>`;
  if(tab.type==='accordion'){
    return open + tab.data.map((c,i)=>`
      <div class="acc-item ${i===0?'open':''}">
        <div class="acc-head"><span>${c.h}</span><span class="chev">▸</span></div>
        <div class="acc-body">${c.body}</div>
      </div>`).join('') + close;
  }

  if(tab.type==='checklist') return open + `<div id="checklistRoot-${grp}"></div>` + close;
  return open + close;
}

/* =========================================================================
   BINDING: ACCORDION, QUIZ, CHECKLIST
   ========================================================================= */
function bindStationInteractivity(code){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const group = btn.closest('.tabbar').dataset.group;
      document.querySelectorAll(`.tab-btn[data-group="${group}"]`).forEach(b=>b.classList.remove('active'));
      document.querySelectorAll(`.tab-panel[data-group="${group}"]`).forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`.tab-panel[data-group="${group}"][data-tab="${btn.dataset.tab}"]`).classList.add('active');
    });
  });
  document.querySelectorAll('.acc-head').forEach(h=>{
    h.addEventListener('click',()=>h.closest('.acc-item').classList.toggle('open'));
  });
  const cfg = STATION_CONFIG[code];
  if(cfg){
    cfg.tabs.forEach(tab=>{
      if(tab.type==='quiz') bindQuiz(code);
      if(tab.type==='checklist') bindChecklist(code);
    });
  }
}

/* =========================================================================
   PROGRESS TRACKING & STORAGE
   ========================================================================= */
// Single source of truth for learner progress. An earlier build declared
// loadProgress/saveProgress twice (this pair plus a second 'gi-progress'
// pair below the curriculum); the second silently won via hoisting, so
// quiz scores and checklist checks were written to a store nothing read.
// This is now the ONLY progress store; the duplicate has been removed.
const STORE_KEY = 'giBoardReviewCourseProgress_v2';
const QUIZZES = {};
const CHECKLISTS = {};

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){/* private mode / quota */}
}
function _record(p, code){ return p[code] || (p[code] = {}); }
function markVisited(code){
  // merge, never overwrite — a re-visit must not wipe quiz/checklist history
  const p = loadProgress(); _record(p, code).visited = true; saveProgress(p); renderProgress();
}
function setQuizScore(code, score, total){
  const p = loadProgress(); const r = _record(p, code);
  r.quizLast = {score, total};
  if(!r.quizBest || score > r.quizBest.score) r.quizBest = {score, total};
  saveProgress(p);
  renderNav(code);   // refresh the nav so the best-score pill appears at once
}
function setCheck(code, key, val){
  const p = loadProgress(); const r = _record(p, code); r.checks = r.checks || {};
  r.checks[key] = val; saveProgress(p); renderProgress();
}
function getChecks(code){ return (loadProgress()[code]||{}).checks || {}; }
function resetProgress(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }

/* =========================================================================
   QUIZ ENGINE (interactive scoring with progress tracking)
   ========================================================================= */
function bindQuiz(code){
  const root = document.getElementById('quizRoot-'+code);
  if(!root) return;
  const qs = QUIZZES[code];
  let idx = 0, score = 0, answered = false;

  function renderQ(){
    const q = qs[idx];
    root.innerHTML = `
      <div class="quiz-progress">${qs.map((_,i)=>`<div class="seg ${i<idx?'done':i===idx?'current':''}"></div>`).join('')}</div>
      <div class="q-stem"><b>Q${idx+1}.</b> ${q.q}</div>
      <div class="q-options">
        ${q.opts.map((o,i)=>`<button class="q-opt" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}
      </div>
      <div id="quizExplain-${code}"></div>
      <div class="quiz-nav">
        <span style="font-size:.8rem;color:var(--text-muted);">Question ${idx+1} of ${qs.length}</span>
        <button class="btn" id="quizNextBtn-${code}" disabled>${idx===qs.length-1?'See Results':'Next'}</button>
      </div>
    `;
    answered = false;
    root.querySelectorAll('.q-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(answered) return;
        answered = true;
        const chosen = parseInt(btn.dataset.i,10);
        root.querySelectorAll('.q-opt').forEach(b=>{
          b.classList.add('disabled');
          const bi = parseInt(b.dataset.i,10);
          if(bi===q.correct) b.classList.add('correct');
          else if(bi===chosen) b.classList.add('incorrect');
        });
        if(chosen===q.correct) score++;
        document.getElementById(`quizExplain-${code}`).innerHTML = `<div class="explain-box"><b>${chosen===q.correct?'Correct.':'Not quite.'}</b> ${q.explain}</div>`;
        document.getElementById(`quizNextBtn-${code}`).disabled = false;
      });
    });
    document.getElementById(`quizNextBtn-${code}`).addEventListener('click',()=>{
      if(idx<qs.length-1){ idx++; renderQ(); }
      else{ renderResult(); }
    });
  }
  function renderResult(){
    setQuizScore(code, score, qs.length);
    root.innerHTML = `
      <div class="quiz-result">
        <div class="score">${score}/${qs.length}</div>
        <div class="score-lbl">correct</div>
        <button class="btn ghost" id="quizRetry-${code}">Retry Quiz</button>
      </div>`;
    document.getElementById(`quizRetry-${code}`).addEventListener('click',()=>{ idx=0; score=0; renderQ(); });
  }
  renderQ();
}

/* =========================================================================
   COMPETENCY CHECKLIST ENGINE (DOPS-style with progress tracking)
   ========================================================================= */
function bindChecklist(code){
  const root = document.getElementById('checklistRoot-'+code);
  if(!root) return;
  const cfg = CHECKLISTS[code];
  const checks = getChecks(code);
  function totalCount(){ return cfg.groups.reduce((a,g)=>a+g.items.length,0); }
  function doneCount(){ return cfg.groups.reduce((a,g)=>a+g.items.filter(([k])=>checks[k]).length,0); }
  function render(){
    const total = totalCount(), done = doneCount();
    const pct = total? Math.round(done/total*100):0;
    root.innerHTML = `
      <div class="chk-summary">
        <div class="ring" style="--pct:${pct}"><span>${pct}%</span></div>
        <div>
          <div style="font-weight:700;">${done} of ${total} criteria checked</div>
          <div style="font-size:.8rem;color:var(--text-muted);">Direct-Observation-of-Procedural-Skills (DOPS) style checklist, adapted from TEESAT. Check off criteria as observed/confirmed by a supervising clinician — this is a self-tracking aid, not a credentialing record.</div>
        </div>
      </div>
      ${cfg.groups.map(g=>`
        <div class="chk-group">
          <h4>${g.name}</h4>
          ${g.items.map(([k,label])=>`
            <label class="chk-item">
              <input type="checkbox" data-k="${k}" ${checks[k]?'checked':''}>
              <span>${label}</span>
            </label>`).join('')}
        </div>`).join('')}
    `;
    root.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change',()=>{
        checks[cb.dataset.k] = cb.checked;
        setCheck(code, cb.dataset.k, cb.checked);
        render();
      });
    });
  }
  render();
}

function findStation(code){
  for(const m of CURRICULUM) for(const s of m.stations) if(s.code===code) return {module:m, station:s};
  return null;
}
function allStations(){
  const out=[]; for(const m of CURRICULUM) for(const s of m.stations) out.push(s); return out;
}
function stationIndex(code){
  const list = allStations(); return list.findIndex(s=>s.code===code);
}
function neighborStations(code){
  const list = allStations(); const i = list.findIndex(s=>s.code===code);
  return {prev:list[i-1]||null, next:list[i+1]||null};
}

/* =========================================================================
   SIDEBAR NAV
   ========================================================================= */
function renderNav(activeCode){
  const nav = document.getElementById('navTree');
  const progress = loadProgress();
  nav.innerHTML = CURRICULUM.map((m,mi)=>{
    const hasActive = m.stations.some(s=>s.code===activeCode);
    return `
    <div class="module-group">
      <button class="module-toggle ${hasActive?'open':''}" data-mod="${mi}" aria-expanded="${hasActive}">
        <span class="module-num">${m.num}</span>
        <span style="flex:1">${m.title}</span>
        <span class="chev" aria-hidden="true">▸</span>
      </button>
      <ul class="station-list ${hasActive?'open':''}" data-mod-list="${mi}">
        ${m.stations.map(s=>{
          const rec = progress[s.code] || {};
          const best = rec.quizBest;
          return `
          <li data-search="${(s.code+' '+s.title).toLowerCase()}">
            <a href="#/station/${s.code}" class="station-link ${s.code===activeCode?'active':''}" data-code="${s.code}" ${s.code===activeCode?'aria-current="page"':''}>
              <span class="dot ${s.status}" aria-hidden="true"></span>
              <span class="st-label">${s.code}. ${s.title}</span>
              ${best?`<span class="score-pill" title="Best quiz score">${best.score}/${best.total}</span>`:''}
              <span class="visited-check" style="display:${rec.visited?'inline':'none'}" title="Visited" aria-label="visited">✓</span>
            </a>
          </li>`;
        }).join('')}
      </ul>
    </div>`;
  }).join('');
  nav.querySelectorAll('.module-toggle').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const open = btn.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
      nav.querySelector(`[data-mod-list="${btn.dataset.mod}"]`).classList.toggle('open');
    });
  });
  applyNavFilter();
  renderProgress();
}

function renderProgress(){
  const all = allStations();
  const p = loadProgress();
  const visited = all.filter(s=>p[s.code] && p[s.code].visited).length;
  const pct = all.length ? Math.round(visited/all.length*100) : 0;
  document.getElementById('progressNum').textContent = pct+'%';
  document.getElementById('progressBar').style.width = pct+'%';
  const label = document.getElementById('progressLabelText');
  if(label) label.textContent = `${visited}/${all.length} visited`;
}

/* ---- sidebar station search ---- */
function applyNavFilter(){
  const box = document.getElementById('navSearch');
  const q = (box && box.value || '').trim().toLowerCase();
  const nav = document.getElementById('navTree');
  if(!nav) return;
  nav.querySelectorAll('.module-group').forEach(group=>{
    let anyVisible = false;
    group.querySelectorAll('li[data-search]').forEach(li=>{
      const hit = !q || li.dataset.search.includes(q);
      li.style.display = hit ? '' : 'none';
      if(hit) anyVisible = true;
    });
    // while searching, force-open modules with a hit and hide empty ones
    const list = group.querySelector('.station-list');
    if(q){
      group.style.display = anyVisible ? '' : 'none';
      if(list) list.classList.toggle('open', anyVisible);
    }else{
      group.style.display = '';
    }
  });
}

function renderPage(hash){
  const page = document.getElementById('page');
  hash = hash || '#/home';
  const parts = hash.split('/');

  if(parts[1]==='station' && parts[2]){
    const found = findStation(parts[2]);
    if(!found) return void(page.innerHTML='<p>Station not found.</p>');
    if(!STATION_CONFIG[found.station.code]){
      page.innerHTML = renderScaffoldStation(found);
    } else {
      page.innerHTML = renderStationBuilt(found);
      bindStationInteractivity(parts[2]);
      markVisited(parts[2]);   // merges — never overwrites quiz/checklist history
    }
    renderNav(parts[2]);
    page.scrollIntoView({block:'start'});
    window.scrollTo(0,0);
    return;
  }

  renderNav('');
  page.innerHTML = `
    <div class="hero">
      <h1>GI Board Review Course</h1>
      <p>Comprehensive medical knowledge curriculum covering gastroenterology disease pathophysiology, diagnosis, management, and patient outcomes. Designed for board preparation and clinical reference.</p>

          body: `<p>Cirrhosis is the end-stage of chronic liver disease, characterized by <span class="tag est">EST</span> diffuse hepatic fibrosis with regenerative nodules, vascular distortion, and loss of normal hepatic function. Histologically, bridging fibrous septa link portal tracts and central veins, obliterating normal liver architecture.</p>
          <p><b>Compensated vs Decompensated:</b></p>

            <li><b>Compensated cirrhosis:</b> Cirrhosis present but NO clinical evidence of portal hypertension complications (no ascites, variceal bleeding, encephalopathy, or hepatorenal syndrome). Survival in compensated cirrhosis is 12+ years median. <span class="tag est">EST</span></li>
            <li><b>Decompensated cirrhosis:</b> One or more clinical complications present (ascites, hepatic encephalopathy, variceal hemorrhage, or hepatorenal syndrome). Median survival drops to 2 years without transplant. <span class="tag est">EST</span></li>

          body: `<p>Leading causes of cirrhosis vary by geography. In the US: <span class="tag est">EST</span></p>

        },

          <p style="background:var(--accent-soft);padding:12px;border-radius:6px;margin:12px 0;font-size:.9rem;"><b>Child-Pugh = Bilirubin + Albumin + INR + Ascites + Encephalopathy grade</b> <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;margin-top:12px;">
            <li><b>Class A (5-6 points):</b> Good prognosis; 100% 1-year survival estimated</li>
            <li><b>Class B (7-9 points):</b> Intermediate; 80% 1-year survival</li>

          </ul>
          <p style="margin-top:12px;font-size:.85rem;color:var(--text-muted);">Child-Pugh is intuitive and captures clinical severity well, but MELD-Na is now preferred for transplant allocation because it is objective and better predicts short-term mortality.</p>`
        }
      ]
    },
    {
      key: 'meld', label: 'MELD-Na Score & Calculator', type: 'cards',
      data: {
        note: 'MELD-Na is used by UNOS/OPTN for liver transplant allocation in the United States. Scores range 6–40+; higher scores indicate higher priority for transplantation. <span class="tag est">EST</span>',
        cards: [
          {
            name: 'MELD Formula (UNOS/OPTN)',
            tag: 'est',
            meta: 'Standard formula used for transplant allocation',
            desc: `<b>MELD = 0.957 × ln(creatinine) + 0.378 × ln(bilirubin) + 1.120 × ln(INR) + 0.643</b> × 10, rounded to nearest integer. <span class="tag est">EST</span><br><br>
            <b>MELD-Na</b> adjusts MELD downward for severe hyponatremia (Na &lt;135 mEq/L) by subtracting points based on serum sodium level. Sodium adjustment accounts for the fact that low sodium predicts higher short-term mortality independent of organ dysfunction markers. <span class="tag est">EST</span><br><br>
            <b>Clinical thresholds:</b> <span class="tag est">EST</span><br>
            • Score &lt;10: Low 3-month mortality<br>
            • Score 10–19: Moderate transplant priority<br>
            • Score 20–29: High priority<br>
            • Score ≥30: Urgent (highest priority)`
          },
          {
            name: 'Worked Example: MELD-Na Calculation',
            tag: 'syn',
            meta: 'Hand-verified arithmetic for educational illustration',
            desc: `<b>Patient labs:</b><br>
            Serum creatinine: 1.5 mg/dL<br>
            Serum bilirubin: 3.0 mg/dL<br>
            INR: 1.8<br>
            Serum sodium: 132 mEq/L<br><br>
            <b>Step 1: Calculate base MELD</b><br>
            ln(1.5) = 0.405<br>
            ln(3.0) = 1.099<br>
            ln(1.8) = 0.588<br><br>
            MELD = 0.957(0.405) + 0.378(1.099) + 1.120(0.588) + 0.643<br>
            MELD = 0.388 + 0.415 + 0.658 + 0.643<br>
            MELD = 2.104 × 10 = 21.04 → <b>21</b><br><br>
            <b>Step 2: Sodium adjustment (MELD-Na, OPTN formula)</b><br>
            MELD-Na = MELD + 1.32 × (137 − Na) − [0.033 × MELD × (137 − Na)]<br>
            (Applied when Na &lt;135 mEq/L; bounds Na to [125, 137])<br><br>
            For this patient (MELD = 21, Na = 132):<br>
            137 − 132 = 5<br>
            1.32 × 5 = 6.6<br>
            0.033 × 21 × 5 = 3.465<br>
            MELD-Na = 21 + 6.6 − 3.465 = 24.135 → rounds to <b>24</b><br><br>
            <b>Interpretation:</b> This patient has MELD-Na 24, which places him in the high transplant priority tier. <span class="tag syn">SYN</span> (Hand calculation; verify against current OPTN calculator before clinical use.)`
          }
        ]
      }
    },
    {
      key: 'childpugh', label: 'Child-Pugh Scoring Table', type: 'reftable',
      data: {
        note: 'Scoring guide for Child-Pugh classification. Each parameter is scored 1–3 points; total 5–15 determines class. <span class="tag est">EST</span>',

          ['Encephalopathy', 'None', 'Grade 1–2', 'Grade 3–4']
        ]
      }
    },
    {
      key: 'quiz', label: 'Knowledge Check', type: 'quiz'
    }
  ]

            <li><b>Dynamic:</b> Increased hepatic vascular tone (endothelial dysfunction, reduced nitric oxide)</li>
          </ul>
          <p>Splanchnic vessels respond with vasodilation and increased blood flow, driving portal hypertension further. Nitric oxide-mediated vasodilation in the splanchnic circulation is a key compensatory but maladaptive response. <span class="tag est">EST</span></p>`

          </ul>`
        }
      ]

            <li>Target MAP ≥65 mmHg; avoid over-resuscitation (increases portal pressure further)</li>

registerStation('1a', {

  subtitle: 'Structural and functional anatomy; normal swallowing mechanics and motility.',

  tabs: [
    {
      key: 'anat', label: 'Esophageal Anatomy & Wall Structure', type: 'accordion',
      data: [
        {
          h: 'Gross Anatomy: Length, Segments & Landmarks',
          body: `<p>The esophagus is a muscular tube extending from the pharynx (C6 level) to the gastroesophageal junction. <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li><b>Length:</b> Approximately 40 cm in adults (range 37–45 cm), measured from incisors to GE junction. <span class="tag est">EST</span></li>
            <li><b>Cervical esophagus:</b> C6 to T1, ~5 cm</li>
            <li><b>Thoracic esophagus:</b> T1 to T10, ~25 cm</li>
            <li><b>Abdominal esophagus:</b> T10 to GE junction, ~2–3 cm (very short; rest is intrathoracic)</li>
          </ul>
          <p><b>Key endoscopic landmarks: <span class="tag est">EST</span></b></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li>Upper esophageal sphincter (UES, Killian's dehiscence): ~15 cm from incisors</li>
            <li>Aortic arch impression: ~25–27 cm from incisors</li>
            <li>Left mainstem bronchus crossing: ~27–28 cm</li>
            <li>Gastroesophageal junction (Z-line): ~38–40 cm from incisors (more in tall men, less in short women)</li>
          </ul>`
        },
        {
          h: 'Histological Wall Layers',
          body: `<p>The esophageal wall has the classic GI tract layers: <span class="tag est">EST</span></p>
          <ol style="line-height:1.8;margin-left:20px;">
            <li><b>Mucosa:</b> Stratified squamous epithelium (non-keratinized) resting on lamina propria</li>
            <li><b>Submucosa:</b> Loose connective tissue containing mucus glands (esophageal glands) and vessels</li>
            <li><b>Muscularis propria:</b> Muscle fibers arranged in inner circular and outer longitudinal layers. Upper third is skeletal muscle; middle third is mixed; lower third is smooth muscle. <span class="tag est">EST</span></li>
            <li><b>Adventitia (not serosa):</b> No visceral peritoneum; the esophagus is retroperitoneal in the thorax</li>
          </ol>
          <p style="margin-top:12px;">This wall structure is clinically important: perforation risks are highest with deep instrumentation or forceful dilation, as the esophagus lacks a protective serosa. <span class="tag est">EST</span></p>`
        },
        {
          h: 'Sphincter Function: UES & LES',
          body: `<p><b>Upper Esophageal Sphincter (UES):</b> <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li>Skeletal muscle (cricopharyngeus and inferior pharyngeal constrictor); under voluntary control</li>
            <li>Resting pressure: 30–60 mmHg (higher than LES)</li>
            <li>Opens reflexively during swallowing; closes afterward to prevent reflux</li>
            <li>Dysfunction causes oropharyngeal dysphagia (food retention, coughing, aspiration risk)</li>
          </ul>
          <p><b>Lower Esophageal Sphincter (LES):</b> <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li>Smooth muscle; involuntary control via vagal parasympathetic and enteric neurons</li>
            <li>Resting pressure: 10–30 mmHg (higher than gastric pressure, which is ~0–5 mmHg, so it acts as a barrier)</li>
            <li>Relaxes (drops to gastric pressure level) on swallowing, allowing food passage</li>
            <li>Incompetence (low resting pressure) allows reflux; hypertonia (high resting pressure) causes achalasia-like obstruction</li>
          </ul>`
        }
      ]
    },
    {
      key: 'physio', label: 'Swallow Physiology & Peristalsis', type: 'accordion',
      data: [
        {
          h: 'Normal Swallow Sequence',
          body: `<p>Swallowing is a coordinated neuromuscular reflex with oral, pharyngeal, and esophageal phases. <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li><b>Oral phase (voluntary):</b> Tongue propels bolus posteriorly; initiates swallow reflex</li>
            <li><b>Pharyngeal phase (involuntary):</b> UES relaxes; pharyngeal muscles contract to propel bolus into esophagus; larynx closes to prevent aspiration</li>
            <li><b>Esophageal phase (involuntary):</b> LES relaxes; primary peristaltic wave propels bolus to stomach. This phase lasts ~5–8 seconds for liquid, longer for solid boluses. <span class="tag est">EST</span></li>
          </ul>`
        },
        {
          h: 'Esophageal Peristalsis',
          body: `<p><b>Primary peristalsis:</b> <span class="tag est">EST</span> Initiated by swallowing; a single coordinated muscular contraction wave travels from upper esophagus to LES at ~2–4 cm/sec. This is the normal clearing mechanism.</p>
          <p><b>Secondary peristalsis:</b> <span class="tag est">EST</span> Triggered by esophageal distension (e.g., from a bolus lodged by primary peristalsis failure or from reflux); helps clear residual food or acid.</p>
          <p><b>Tertiary contractions:</b> Uncoordinated, non-peristaltic muscle contractions seen in elderly or patients with achalasia or diffuse esophageal spasm; ineffective for food propulsion and may cause dysphagia or chest pain. <span class="tag est">EST</span></p>`
        }
      ]
    },
    {
      key: 'endo', label: 'Endoscopic Appearance & Landmarks', type: 'accordion',
      data: [
        {
          h: 'Normal Esophageal Mucosa on EGD',
          body: `<p>Normal esophageal mucosa appears <b>pale, glistening, and smooth</b> with a faint longitudinal fold pattern. <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li><b>Color:</b> Gray-white to pale pink (stratified squamous epithelium lacks rich vascularity of gastric mucosa)</li>
            <li><b>Texture:</b> Smooth; rugae (folds) are minimal compared to stomach</li>
            <li><b>Landmarks:</b> Pulsations from the descending thoracic aorta can sometimes be seen on the left wall (~25–27 cm); this is normal and benign</li>
            <li><b>Z-line (squamocolumnar junction):</b> Appears as an abrupt color change from pale (squamous) to salmon-pink (columnar/gastric mucosa), usually at 38–40 cm. <span class="tag est">EST</span> Displacement proximal to the hiatus = hiatal hernia</li>
          </ul>`
        }
      ]
    },
    {
      key: 'quiz', label: 'Knowledge Check', type: 'quiz'
    }
  ]
});

        {
          h: 'Metaplastic Transformation',
          body: `<p>Barrett\'s esophagus is chronic replacement of normal stratified squamous epithelium with specialized columnar epithelium containing intestinal-type mucosa (goblet cells). <span class="tag est">EST</span></p>
          <p>Mechanism: Chronic acid reflux damages squamous mucosa → regeneration produces abnormal, acid-resistant columnar metaplasia (adaptation). Over years, metaplasia can acquire dysplastic changes (low-grade → high-grade dysplasia → adenocarcinoma). <span class="tag est">EST</span></p>
          <p><b>Cancer risk:</b> Non-dysplastic Barrett\'s carries ~0.2–0.5% per year annual adenocarcinoma risk; high-grade dysplasia ~5–20% per year. <span class="tag est">EST</span></p>`
        },
        {
          h: 'Definition by Extent',
          body: `<p>Barrett\'s is defined as ≥3 cm of specialized intestinal metaplasia in the esophagus (by Prague C and M measurement). <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li><b>Short-segment Barrett\'s:</b> <3 cm (Prague M <3 cm)</li>

      data: [
        {
          h: 'Prague Classification (C & M)',
          body: `<p>The Prague Classification standardizes Barrett\'s measurement for prognostication and surveillance. <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li><b>C (Circumferential extent):</b> Highest point at which Barrett\'s epithelium is visible in all four quadrants (circumference), measured in cm from the GE junction</li>
            <li><b>M (Maximal extent):</b> Highest point at which Barrett\'s is visible in any quadrant, measured in cm from the GE junction</li>
          </ul>
          <p><b>Example:</b> Prague C3M7 = 3 cm circumferential, 7 cm maximal extent = long-segment Barrett\'s (M ≥3 cm). <span class="tag est">EST</span></p>`
        },
        {
          h: 'Dysplasia Grading',
          body: `<p>Barrett\'s is biopsied and graded histologically: <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li><b>Non-dysplastic Barrett\'s (NDBE):</b> Specialized metaplasia without histologic dysplasia</li>
            <li><b>Indefinite dysplasia:</b> Borderline features; worrisome but not diagnostic dysplasia. Requires expert review and follow-up</li>
            <li><b>Low-grade dysplasia (LGD):</b> Mild nuclear crowding, hyperchromasia, enlarged nuclei, but intact mucosa architecture. Annual rebleeding risk ~0.5% but ~30% progress to HGD/cancer over 5 years if untreated. <span class="tag est">EST</span></li>

          <ul style="line-height:1.8;margin-left:20px;">
            <li>Surveillance EGD with biopsies every 3 years (established practice, rationale: low malignancy risk if unchanged)</li>
            <li>Exception: very short-segment (<1 cm) may have surveillance every 5 years or even no surveillance in low-risk patients <span class="tag syn">SYN</span></li>
          </ul>
          <p><b>Indefinite Dysplasia:</b> <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">

          </ul>
          <p><b>Low-Grade Dysplasia:</b> <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li>Expert confirmation biopsies (second pathologist review); if confirmed, surveillance every 6–12 months OR consider radiofrequency ablation</li>

registerStation('1d', {
  title: 'Esophageal Obstruction: Rings, Webs & Strictures',
  subtitle: 'Schatzki rings, Plummer-Vinson webs, caustic/peptic strictures; dilation management.',
  objectives: [

  ],
  tabs: [
    {
      key: 'ring', label: 'Schatzki Ring & Esophageal Webs', type: 'accordion',
      data: [
        {
          h: 'Schatzki Ring',
          body: `<p>A Schatzki ring is a thin, circumferential fibromuscular narrowing of the distal esophagus, usually at the squamocolumnar junction (GE junction region). <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li><b>Prevalence:</b> ~5–14% of the population on barium studies; most are asymptomatic. <span class="tag est">EST</span></li>
            <li><b>Symptom threshold:</b> Rings >13 mm diameter are typically asymptomatic; rings <13 mm often cause dysphagia (especially to solids). <span class="tag est">EST</span></li>
            <li><b>Composition:</b> Smooth muscle, mucosa, and fibrous tissue; not muscular hypertrophy</li>
            <li><b>Management:</b> Asymptomatic rings require no treatment. Symptomatic rings <13 mm may require serial dilations or one-time dilation. <span class="tag est">EST</span></li>
          </ul>`
        },
        {
          h: 'Esophageal Webs',
          body: `<p>Esophageal webs are thin, anterior mucosal structures (epithelium + lamina propria only, no submucosa/muscle) that cause partial esophageal narrowing. <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li><b>Location:</b> Typically mid-to-upper esophagus (anterior wall)</li>
            <li><b>Plummer-Vinson Syndrome:</b> <span class="tag est">EST</span> A triad of (1) iron deficiency anemia, (2) koilonychia (spoon nails), and (3) upper esophageal webs. Associated with increased oral and esophageal squamous cell carcinoma risk. Syndrome is now rare in developed countries due to iron supplementation availability</li>
            <li><b>Management:</b> Iron repletion often improves or resolves webs. Endoscopic dilation or web division if dysphagia persists. <span class="tag est">EST</span></li>
          </ul>`
        }
      ]
    },
    {
      key: 'strict', label: 'Peptic vs. Caustic Strictures', type: 'accordion',
      data: [
        {
          h: 'Peptic Strictures',
          body: `<p>Peptic strictures result from chronic ulceration and scarring due to acid reflux. <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li><b>Location:</b> Usually distal esophagus at the GE junction region</li>
            <li><b>Appearance:</b> Irregular, asymmetric narrowing with a fibrotic, ulcerated base visible at endoscopy</li>
            <li><b>Associations:</b> Long-standing GERD, Barrett\'s esophagus, heavy smoking</li>
            <li><b>Management:</b> <span class="tag est">EST</span> PPI therapy (to suppress further acid damage) + serial bougie or balloon dilations (typically q2–4 weeks as needed). Surgical resection only if refractory to >5 dilations or complications</li>
          </ul>`
        },
        {
          h: 'Caustic Strictures',
          body: `<p>Caustic strictures develop after accidental or intentional ingestion of strong acids or alkalis (lye, drain cleaner). <span class="tag est">EST</span></p>
          <ul style="line-height:1.8;margin-left:20px;">
            <li><b>Acute phase (days 1–4):</b> Mucosal necrosis, hemorrhage, vomiting, severe pain. Perforation risk is highest here</li>
            <li><b>Granulation phase (weeks 2–4):</b> Inflammation and edema subside but fibrin deposition and collagen deposition begin</li>
            <li><b>Fibrotic phase (weeks 4+):</b> Fixed stricture forms, often in the mid-esophagus (more proximal than peptic strictures). Strictures are typically long (>5 cm), rigid, and often multiple</li>
            <li><b>Appearance:</b> Tight, rigid, asymmetric narrowing; often lacks a visible ulcer base (scar tissue dominates)</li>
            <li><b>Management:</b> <span class="tag est">EST</span> Acute: NPO, IV hydration, consider antacids (no proven benefit). Avoid endoscopy in acute phase due to perforation risk. Delayed dilation (weeks 2–3) if stricture develops. Surgical resection for long, severe strictures unresponsive to dilation</li>
          </ul>`
        }
      ]
    },
    {
      key: 'dilate', label: 'Stricture Dilation Techniques', type: 'accordion',

tory of CRC in 1st-degree relative age <60 OR ≥2 relatives age 60+: start at age 40 or 10 years before youngest case</li><li>Prior adenoma: colonoscopy surveillance per size/histology (3–10 years)</li></ul><p><b>High-risk:</b> Personal history of CRC, IBD, Lynch syndrome, FAP → specialized protocols with shorter intervals and possible chemoprevention</p>'}]

ary, small bowel, urinary tract:</b> Modest increased risk; surveillance individualized</li></ul>'}]

      {h: 'Immune Dysregulation & Genetic Factors', body: '<p>Crohn disease is a chronic, transmural inflammatory disorder of the GI tract caused by complex interaction of genetic predisposition, environmental triggers, and dysregulated innate/adaptive immunity. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Genetic factors:</b> NOD2/CARD15 polymorphisms (increased susceptibility); IL-23 pathway dysfunction</li><li><b>Environmental:</b> Smoking, dysbiosis, early antibiotics</li><li><b>Immune mechanism:</b> Loss of tolerance to commensal bacteria → Th1/Th17 response activation (IL-12, IL-23)</li></ul><p>Result: Transmural inflammation (all layers of bowel wall), crypt abscesses, fissuring ulcers, potential fistulization</p>'},
      {h: 'Montreal Classification: Age at Diagnosis (A)', body: '<p>Age category defines prognostic implications for disease severity and phenotype: <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>A1:</b> <16 years (pediatric-onset; typically more aggressive phenotype)</li><li><b>A2:</b> 16–40 years (young adult; most common presentation)</li><li><b>A3:</b> >40 years (older-onset; often milder disease course)</li></ul>'},
      {h: 'Montreal Classification: Location (L)', body: '<p>Anatomic location defines endoscopic surveillance strategy and complications risk: <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>L1 (Terminal ileal only):</b> ~30% of cases; may present with RLQ pain/mass</li><li><b>L2 (Colonic only):</b> ~25%; often mimics UC but with focal lesions; skip lesions typical</li><li><b>L3 (Ileocolonic):</b> ~40%; most common; involves terminal ileum + colon</li><li><b>L4 (Proximal GI only):</b> ~5%; stomach, duodenum, jejunum involved; rare sole site</li></ul><p>Note: Patients can have L4 in addition to L1-L3 (modifier); indicates upper GI involvement</p>'},
      {h: 'Montreal Classification: Behavior (B)', body: '<p>Phenotypic behavior defines treatment strategy and surgical indications: <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>B1 (Non-stricturing, non-penetrating):</b> Purely inflammatory; no fistulas or stenoses</li><li><b>B2 (Stricturing):</b> Fibrostenosing disease; abdominal pain, obstruction; may need surgical resection</li><li><b>B3 (Penetrating):</b> Fistulizing disease (internal abdominal, enterocutaneous, perianal)</li><li><b>+p modifier:</b> Perianal disease if present (fistulas, skin tags, abscesses in perianal region)</li></ul><p>Important: Behavior can evolve during disease course; typically B1→B2 or B1→B3 progression</p>'},

    {key: 'path', label: 'UC Pathophysiology & Mayo Score', type: 'accordion', data: [
      {h: 'Disease Definition & Mucosal Involvement', body: '<p>Ulcerative colitis is a chronic inflammatory disorder limited to the colon and rectum, with inflammation confined to the mucosa and submucosa (non-transmural). <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Continuous pattern:</b> Uninterrupted inflammation starting from rectum and extending proximally</li><li><b>Inflammation depth:</b> Mucosa/submucosa only; muscularis propria spared (unless fulminant toxic megacolon)</li><li><b>Extent categories:</b> Proctitis (<15 cm), left-sided colitis (rectum to splenic flexure), extensive/pancolitis (entire colon)</li></ul><p>Prevalence: ~3–8 per 100,000 (US); typically age 15–40 at onset; bimodal with peak >60 years</p>'},
      {h: 'Mayo Endoscopic Activity Score (MEAS)', body: '<p>The Mayo Score is a validated disease-activity index combining clinical and endoscopic components, each scored 0–3. <span class="tag est">EST</span> Total range: 0–12</p><ul style="line-height:1.8;margin-left:20px;"><li><b>Stool frequency:</b></li><ul><li>0 = normal number</li><li>1 = 1–2 more than normal</li><li>2 = 3–4 more than normal</li><li>3 = ≥5 more than normal</li></ul><li><b>Rectal bleeding:</b></li><ul><li>0 = no blood</li><li>1 = streaks of blood with stool <50% of time</li><li>2 = obvious blood in stool ≥50% of time</li><li>3 = blood alone (passed without stool)</li></ul><li><b>Findings on endoscopy:</b></li><ul><li>0 = normal or inactive disease</li><li>1 = mild disease (erythema, decreased vascular pattern, mild friability)</li><li>2 = moderate disease (marked erythema, absent vascular pattern, friability, erosions)</li><li>3 = severe disease (spontaneous bleeding, ulceration)</li></ul><li><b>Physician global assessment:</b></li><ul><li>0 = normal</li><li>1 = mild disease</li><li>2 = moderate disease</li><li>3 = severe disease</li></ul></ul><p><b>Interpretation:</b> 0–2 = remission, 3–7 = mild, 8–10 = moderate, ≥11 = severe</p>'},
      {h: 'Mayo Score Worked Example', body: '<p><b>Case:</b> 38-year-old with 8-year UC history presents with 6–7 stools daily (baseline 2), bloody diarrhea in >50% of stools, and mild rectal pain. Colonoscopy shows diffuse erythema with decreased vascular pattern and scattered erosions throughout colon (no spontaneous bleeding). Physician rates disease as moderate activity.</p><p><b>Scoring:</b> <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li>Stool frequency: 6–7 stools vs. baseline 2 = 4–5 more → score 3</li><li>Rectal bleeding: blood in ≥50% of stools → score 2</li><li>Endoscopic findings: marked erythema, absent vascular pattern, erosions (no spontaneous bleeding) → score 2</li><li>Physician global: moderate disease → score 2</li></ul><p><b>Total Mayo = 3 + 2 + 2 + 2 = 9</b> → Moderate disease activity, warrants intensified induction therapy (escalate 5-ASA or add corticosteroid/biologic)</p>'},
      {h: 'Complications: Toxic Megacolon & Cancer Risk', body: '<p><b>Acute severe complications:</b> <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Toxic megacolon:</b> Fulminant colitis with loss of colonic tone and dilated colon (>6 cm on imaging); risk of perforation; medical emergency requiring ICU + surgery if no response to medical therapy in 48–72 hrs</li><li><b>Perforation, bleeding:</b> Uncommon but life-threatening</li></ul><p><b>Long-term complications:</b> <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Colorectal cancer:</b> Cumulative risk ~2% at 10 years, ~8% at 20 years, ~18% at 30 years (varies with extent/inflammation duration)</li><li><b>Primary sclerosing cholangitis (PSC):</b> 2–7% of UC patients; independent of disease activity; 10–15× higher risk of cholangiocarcinoma</li></ul>'},
    ]},
    {key: 'quiz', label: 'Knowledge Check', type: 'quiz'},
    {key: 'checklist', label: 'Assessment', type: 'checklist'},

// ============ STATION 4c: IBD Pharmacotherapy: Induction & Maintenance ============
registerStation('4c', {
  title: 'IBD Pharmacotherapy: Induction & Maintenance',
  objectives: [
    'Explain mechanism and efficacy of 5-ASAs (mesalamine) for mild-moderate UC and ileocolonic Crohn disease',
    'Apply corticosteroids appropriately for induction of remission (not maintenance) and recognize long-term toxicity risks',
    'Compare anti-TNF agents (infliximab IV vs. adalimumab SC) by mechanism, schedule, efficacy (~60-70%), and infection risks',
    'Distinguish anti-integrin vedolizumab (α4β7 blocker) as gut-selective alternative with lower infection risk than anti-TNF',
    'Evaluate JAK inhibitors (tofacitinib) as oral agents with faster onset than IV biologics',

    'Select appropriate induction and maintenance schedules for each drug class'
  ],
  tabs: [
    {key: 'pharm', label: 'Drug Classes & Mechanisms', type: 'accordion', data: [
      {h: '5-Aminosalicylates (5-ASAs)', body: '<p>First-line therapy for mild-to-moderate UC and ileocolonic Crohn disease; limited efficacy in ileal-only Crohn disease. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Mesalamine formulations:</b> Topical (enema, suppository) for distal disease; oral (delayed-release or pH-dependent for distal targeting)</li><li><b>Mechanism:</b> Anti-inflammatory (NF-κB inhibition, TNF reduction); anti-oxidant effects</li><li><b>Induction dose:</b> 2.4–4.8 g daily (divided); maintenance ~2.4 g daily</li><li><b>Efficacy:</b> ~60–70% achieve remission in mild UC; less effective in Crohn (especially ileal)</li><li><b>Adverse effects:</b> Diarrhea, headache, interstitial nephritis (rare; monitor Cr), pancreatitis (rare)</li></ul>'},
      {h: 'Corticosteroids', body: '<p>Potent anti-inflammatory; used for induction of remission, not maintenance (long-term toxicity). <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Prednisone (systemic):</b> 40–60 mg daily × 1–2 weeks, then taper over 8–12 weeks</li><li><b>Budesonide (targeted release):</b> 9 mg daily; preferred over prednisone in ileocolonic Crohn (less systemic toxicity)</li><li><b>Efficacy:</b> 60–80% achieve remission within 4 weeks (induction only)</li><li><b>Long-term use risks:</b> Osteoporosis, hyperglycemia, adrenal suppression, infection</li></ul>'},
      {h: 'Anti-TNF Biologics', body: '<p>TNF-α is a key pro-inflammatory cytokine in IBD pathogenesis; anti-TNF agents are highly effective for moderate-to-severe disease and fistulizing Crohn. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Infliximab:</b> Chimeric monoclonal antibody; IV induction (weeks 0, 2, 6) then maintenance every 8 weeks</li><li><b>Adalimumab:</b> Human monoclonal antibody; subcutaneous; induction dose then maintenance every 2 weeks</li><li><b>Mechanism:</b> Bind TNF-α, prevent receptor engagement, enable apoptosis of activated T cells</li><li><b>Efficacy:</b> ~60–70% remission in moderate-severe UC/Crohn; particularly effective for fistulizing phenotype</li><li><b>Adverse effects:</b> Injection/infusion reactions, infections (TB risk; require latent TB screening), malignancy (small increased risk)</li></ul>'},
      {h: 'Anti-Integrin Agents', body: '<p>α4β7 integrin mediates T-cell homing to gut mucosa; vedolizumab selectively blocks gut-specific trafficking without systemic immunosuppression. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Vedolizumab:</b> IV induction (weeks 0, 2, 4) then maintenance every 4 weeks</li><li><b>Mechanism:</b> Blocks α4β7 integrin–MAdCAM-1 interaction; prevents lymphocyte recruitment to gut</li><li><b>Efficacy:</b> ~55–60% remission in UC/Crohn; particularly useful in anti-TNF-naïve patients</li><li><b>Advantage:</b> Gut-selective; lower infection risk than anti-TNF</li></ul>'},
      {h: 'Anti-IL-12/IL-23 & JAK Inhibitors', body: '<p>Newer agents targeting IL-23 pathway (Th17 differentiation) and JAK signaling; approved for moderate-severe UC/Crohn. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Ustekinumab:</b> Anti-IL-12/IL-23 monoclonal antibody; IV induction, then subcutaneous maintenance</li><li><b>Tofacitinib/Upadacitinib:</b> JAK inhibitors (JAK1/3 for tofacitinib; JAK1-selective for upadacitinib); oral daily dosing</li><li><b>Efficacy:</b> Tofacitinib ~55% remission in UC; comparable to biologic agents</li><li><b>Advantage:</b> Oral formulation; faster onset than IV biologics</li></ul>'},
      {h: 'Step-Up vs. Top-Down Treatment Philosophy', body: '<p><b>Conventional step-up strategy:</b> <span class="tag est">EST</span> 5-ASA → add corticosteroid → escalate to biologic (if inadequate response). Delays immunosuppression; balances toxicity risk with efficacy. Typical for mild-moderate disease.</p><p><b>Top-down strategy:</b> <span class="tag est">EST</span> Initiate biologic early (weeks 0–2) if risk factors for poor prognosis (extensive disease, high CRP, young age, requirement for hospitalization). Evidence suggests faster remission and reduced hospitalizations/surgeries, but greater upfront immunosuppression exposure. Increasingly favored in moderate-severe and pediatric IBD.</p>'},
    ]},
    {key: 'quiz', label: 'Knowledge Check', type: 'quiz'},
    {key: 'checklist', label: 'Assessment', type: 'checklist'},
  ]
});

      {h: 'Dysplasia Grading & Definition', body: '<p>Dysplasia in IBD represents neoplastic transformation (abnormal growth with malignant potential) and is graded histologically by a GI pathologist. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Low-grade dysplasia (LGD):</b> Increased nuclear size/hyperchromasia, crowded glands, but preserved architecture; ~30–40% risk of progression to HGD/cancer within 5 years</li><li><b>High-grade dysplasia (HGD):</b> Loss of architectural organization, increased mitoses, prominent nucleoli; ~40–50% risk of concurrent cancer; high risk of progression</li><li><b>Cancer:</b> Invasion through muscularis mucosae into submucosa or deeper</li></ul>'},
      {h: 'Surveillance Recommendations by Risk', body: '<p><b>ACG/AGA Consensus (EST):</b> <span class="tag est">EST</span> Surveillance colonoscopy is recommended for patients with UC of ≥8 years duration (with extensive colitis) or ≥12–15 years (with left-sided disease). For Crohn colitis, similar logic applies (≥8 years extensive).</p><ul style="line-height:1.8;margin-left:20px;"><li><b>Low-risk patients:</b> No dysplasia on initial surveillance, quiescent disease → every 1–2 years</li><li><b>Intermediate-risk:</b> LGD detected → repeat colonoscopy in 3–6 months (confirm dysplasia, rule out advanced lesion); if LGD persists, consider colectomy or frequent surveillance</li><li><b>High-risk:</b> HGD or cancer detected → colectomy recommended (risk of progression/occult cancer)</li></ul><p><b>Special note:</b> Dysplasia can be multifocal; extensive surveillance with targeted biopsies (4-quadrant biopsies every 10 cm) improves detection. Chromoendoscopy (dye spray) or high-definition colonoscopy enhances dysplasia detection (tag as SYN if specific sensitivity % not provided).</p>'},

      {h: 'Hepatitis A Serology', body: '<p>Acute HAV infection produces a characteristic serologic pattern with early IgM followed by IgG. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Anti-HAV IgM:</b> Positive during acute infection (first weeks); indicates recent/acute HAV</li><li><b>Anti-HAV IgG:</b> Appears weeks into illness and persists lifelong; indicates immunity (prior infection or vaccination)</li><li><b>HAV RNA:</b> Detectable by PCR early; correlates with infectivity</li><li><b>Clinical correlation:</b> IgM-positive + elevated transaminases + jaundice = acute HAV (even without knowing exposure)</li></ul>'},
      {h: 'Hepatitis B Serology Panel', body: '<p>HBV serology is complex, with multiple markers defining acute, chronic, resolved, and immune states. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>HBsAg (hepatitis B surface antigen):</b> First marker to appear; indicates current or recent infection (acute or chronic)</li><li><b>Anti-HBs (antibody to surface antigen):</b> Indicates recovery and immunity; mutually exclusive with HBsAg (with rare exceptions)</li><li><b>Anti-HBc IgM:</b> Indicates acute HBV infection; appears with HBsAg</li><li><b>Anti-HBc IgG:</b> Indicates prior HBV exposure (acute or chronic); persists regardless of HBsAg status</li><li><b>HBeAg / anti-HBe:</b> Markers of viral replication; HBeAg+ indicates higher infectivity and HBV DNA levels</li><li><b>HBV DNA:</b> Quantitative measure of viral load; directly correlates with infectivity and guides treatment decisions</li></ul><p><b>Serology Patterns:</b> <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Acute HBV:</b> HBsAg+, anti-HBc IgM+, anti-HBc IgG-, ALT severely elevated</li><li><b>Chronic HBV:</b> HBsAg+, anti-HBc IgG+, anti-HBc IgM typically- (may be+ early)</li><li><b>Resolved HBV:</b> HBsAg-, anti-HBs+, anti-HBc IgG+ (marker of immunity/prior exposure)</li><li><b>Vaccinated (immune):</b> Anti-HBs+, all others negative</li></ul>'},
      {h: 'Hepatitis C Serology & RNA Detection', body: '<p>HCV serology lags behind active infection; HCV RNA (by PCR) is the gold standard for detecting current infection. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Anti-HCV antibody:</b> May not appear until weeks into acute infection; can be negative in early acute HCV, leading to false reassurance</li><li><b>HCV RNA (by PCR/RT-PCR):</b> Detectable within days of infection; indicates active viremia and infectivity</li><li><b>HCV genotype:</b> Six major genotypes (1–6); genotype 1 most common in US; genotype determines DAA regimen duration and efficacy</li><li><b>Clinical pattern:</b> HCV RNA+ = current/active infection (acute or chronic). Anti-HCV+ with HCV RNA- = resolved (cleared) infection</li></ul>'},
      {h: 'Hepatitis E & Other Viruses', body: '<p>HEV typically causes acute, self-limited infection; rare chronic progression in immunosuppressed. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Anti-HEV IgM:</b> Indicates acute infection</li><li><b>Anti-HEV IgG:</b> Indicates prior/recovering infection</li><li><b>Risk factors for fulminant HEV:</b> Pregnancy, older age, pre-existing cirrhosis</li><li><b>Diagnosis:</b> HEV serology + PCR if available. Often diagnosed on stool/serum samples</li></ul><p><b>Other hepatotropic viruses:</b> CMV, EBV can cause acute hepatitis in immunosuppressed; HDV (delta hepatitis) requires concurrent HBV.</p>'},
    ]},
    {key: 'sero_table', label: 'Serology Reference Table', type: 'reftable', data: {

  tabs: [
    {key: 'hbv', label: 'Chronic HBV: Phases & Natural History', type: 'accordion', data: [

      {h: 'HBeAg-Negative Chronic HBV', body: '<p>HBeAg-negative chronic HBV (anti-HBe+) typically has lower but detectable HBV DNA. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>HBV DNA:</b> Usually <10^5 copies/mL; can fluctuate</li><li><b>ALT:</b> Often near-normal; some patients develop intermittent flares</li><li><b>Natural history:</b> Generally slower disease progression than HBeAg-positive phase, but still carries cirrhosis/HCC risk</li><li><b>Diagnosis:</b> More common in certain populations (Mediterranean, Asian genotypes)</li></ul>'},
      {h: 'Treatment Indications: ALT, HBV DNA, Fibrosis Thresholds', body: '<p><b>General framework (EST with SYN caveat on exact thresholds):</b> <span class="tag est">EST</span> Treatment decisions are individualized based on ALT level, HBV DNA level, and liver fibrosis stage. <span class="tag syn">SYN</span> Specific thresholds (e.g., ALT >2× ULN, HBV DNA >2000 or >10^5 copies/mL) vary by guideline (AASLD, EASL, APASL) and are regularly updated; if confident in specific numbers, use EST; if uncertain, describe concept and tag thresholds SYN.</p><ul style="line-height:1.8;margin-left:20px;"><li><b>HBeAg-positive:</b> Consider treatment if ALT elevated + HBV DNA high + significant fibrosis (F2+)</li><li><b>HBeAg-negative:</b> Consider treatment if ALT elevated + detectable HBV DNA + significant fibrosis OR if cirrhosis present</li><li><b>Cirrhosis (any HBeAg status):</b> Treatment generally recommended regardless of ALT/HBV DNA level</li></ul>'},
      {h: 'Antiviral Agents & Mechanisms', body: '<p>Multiple oral antivirals approved for chronic HBV; main classes are nucleoside/nucleotide reverse transcriptase inhibitors. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Lamivudine (3TC):</b> Older agent; high resistance rate (70–80% at 5 years)</li><li><b>Tenofovir (TDF/TAF):</b> Potent, low resistance; standard first-line for most patients</li><li><b>Entecavir:</b> Potent, low resistance; alternative first-line</li><li><b>Mechanism:</b> Inhibit reverse transcriptase; reduce HBV DNA replication</li><li><b>Resistance risk:</b> Lamivudine > entecavir/tenofovir; long-term monotherapy increases resistance risk</li><li><b>Durability:</b> Usually requires indefinite therapy; discontinuation risks HBV reactivation</li></ul>'},

// ============ STATION 5c: Hepatitis C: From Discovery to Cure ============

  ],
  tabs: [
    {key: 'hcv', label: 'HCV Genotypes & DAA Therapy', type: 'accordion', data: [
      {h: 'HCV Genotypes & Geographic Distribution', body: '<p>Six major HCV genotypes (1-6) with distinct geographic patterns and treatment implications. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Genotype 1:</b> Most common in North America/Europe (~40–50% of US HCV); historically difficult to treat</li><li><b>Genotype 2:</b> ~10% of US HCV; typically lower viral load; historically faster to cure with older interferons</li><li><b>Genotype 3:</b> ~10% of US HCV; associated with metabolic syndrome and liver steatosis</li><li><b>Genotype 4:</b> Common in Middle East/Africa; historically lower cure rates with older regimens</li><li><b>Genotype 5:</b> Rare globally; limited data</li><li><b>Genotype 6:</b> Found in Southeast Asia; emerging in other regions; limited treatment data</li></ul><p>With modern pan-genotypic DAAs, genotype has become less critical for treatment selection; cure rates >95% across all genotypes. <span class="tag est">EST</span></p>'},
      {h: 'Direct-Acting Antivirals (DAAs): Mechanism & Efficacy', body: '<p>DAAs target specific HCV non-structural proteins, achieving rapid viral suppression. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>NS3/4A protease inhibitors:</b> Prevent polyprotein cleavage; examples: simeprevir, paritaprevir</li><li><b>NS5A inhibitors:</b> Prevent viral assembly and RNA replication; highly potent; examples: daclatasvir, ledipasvir, ombitasvir</li><li><b>NS5B polymerase inhibitors (nucleoside/non-nucleoside):</b> Inhibit RNA replication; examples: sofosbuvir (nucleoside), dasabuvir (non-nucleoside)</li><li><b>Combination regimens:</b> Modern therapy uses 2–3 DAA classes in combination; shorter duration (8–12 weeks) vs. 24 weeks with older regimens</li></ul>'},
      {h: 'Cure Rates & Sustained Virologic Response (SVR)', body: '<p><b>Sustained virologic response (SVR):</b> <span class="tag est">EST</span> HCV RNA remains undetectable 12+ weeks after completing DAA treatment (SVR12). Indicates functional cure (>99% do not relapse).</p><ul style="line-height:1.8;margin-left:20px;"><li><b>Modern DAA cure rates:</b> >95% across all genotypes, even in cirrhotic patients. <span class="tag est">EST</span> Pan-genotypic regimens (e.g., sofosbuvir/velpatasvir ± voxilaprevir) achieve near-universal cure.</li><li><b>Treatment duration:</b> 8–12 weeks (vs. 24–48 weeks with interferon-based regimens)</li><li><b>Factors affecting cure:</b> Prior treatment history (treatment-naïve vs. treatment-experienced), cirrhosis status (minimal impact with modern DAAs), adherence</li><li><b>Resistance-associated variants (RAVs):</b> Can emerge with DAA monotherapy or dual therapy; combination regimens minimize resistance risk</li></ul>'},
      {h: 'Global Elimination & Public Health Impact', body: '<p>HCV elimination is now a realistic goal with widespread DAA access. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>WHO HCV elimination goals:</b> 90% reduction in HCV-related mortality and 80% reduction in incidence by 2030</li><li><b>Access barriers:</b> Cost, generic availability, screening, linkage to care remain challenges in low/middle-income countries</li><li><b>Re-infection risk:</b> Cured patients can become re-infected with new HCV exposure; no sterilizing immunity; counseling on transmission routes important</li></ul>'},

// ============ STATION 5d: Non-Alcoholic Fatty Liver Disease (NAFLD) ============
registerStation('5d', {

    'Recognize that most NAFLD patients have simple steatosis with low fibrosis progression risk; subset develop NASH and progressive fibrosis',
