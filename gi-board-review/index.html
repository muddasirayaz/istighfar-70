  ],
  tabs: [
    {key: 'nafld', label: 'NAFLD Pathophysiology & Natural History', type: 'accordion', data: [
      {h: 'NAFLD Definition & Spectrum', body: '<p>NAFLD is defined by hepatic steatosis (>5% liver fat by imaging or histology) in absence of significant alcohol use. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Simple steatosis:</b> Fatty infiltration alone; stable, low fibrosis risk</li><li><b>NASH (non-alcoholic steatohepatitis):</b> Steatosis + inflammation (hepatocyte ballooning, lobular inflammation) ± fibrosis; ~20–30% of NAFLD patients</li><li><b>NASH with fibrosis:</b> Subset of NASH; progression risk correlates with fibrosis stage</li><li><b>NASH cirrhosis:</b> End-stage NAFLD; risk of HCC and decompensation</li></ul><p><b>Prevalence:</b> NAFLD affects ~25–30% of global population; NASH in ~3–5% (higher in obesity/T2DM)</p>'},
      {h: 'Pathogenesis: Insulin Resistance & Lipotoxicity', body: '<p>NAFLD pathophysiology is multifactorial, centered on insulin resistance and hepatic lipid accumulation. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Insulin resistance:</b> Impairs lipolysis; increases hepatic uptake of free fatty acids</li><li><b>Lipotoxicity:</b> Accumulated triglycerides activate inflammatory pathways; oxidative stress</li><li><b>Mitochondrial dysfunction:</b> Impaired fatty acid oxidation; increased ROS production</li><li><b>Gut dysbiosis:</b> May contribute to endotoxemia and systemic inflammation</li></ul><p>Result: Progressive hepatic inflammation, fibrogenesis (stellate cell activation), and potential cirrhosis if unchecked.</p>'},
      {h: 'FIB-4 Index: Calculation & Interpretation', body: '<p><b>FIB-4 is a non-invasive fibrosis marker used to stratify NAFLD patients for advanced fibrosis risk.</b> <span class="tag est">EST</span></p><p><b>Formula:</b> FIB-4 = (Age [years] × AST [U/L]) / (Platelet count [×10⁹/L] × √ALT [U/L])</p><p><b>Interpretation (EST for general structure, SYN for specific cutoffs which vary by guideline):</b> <span class="tag syn">SYN</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>FIB-4 <1.3:</b> Low risk of advanced fibrosis (F3-F4); typically reassuring</li><li><b>FIB-4 1.3–2.67:</b> Indeterminate zone; consider additional testing (FibroScan/transient elastography, enhanced imaging, or biopsy if clinical suspicion high)</li><li><b>FIB-4 >2.67:</b> High risk of advanced fibrosis; warrants further evaluation ± liver biopsy</li></ul><p><b>Limitations:</b> Age-dependent (higher in older patients); less accurate in cirrhosis; platelet count confounded by other conditions</p>'},
      {h: 'FIB-4 Index Worked Example', body: '<p><b>Case:</b> 55-year-old man with incidental hepatic steatosis on ultrasound, type 2 diabetes, BMI 32. Labs: AST=65 U/L, ALT=85 U/L, Platelets=180 ×10⁹/L.</p><p><b>FIB-4 Calculation (step-by-step):</b> <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li>Age = 55 years</li><li>AST = 65 U/L</li><li>Platelet count = 180 ×10⁹/L</li><li>ALT = 85 U/L</li><li>√ALT = √85 ≈ 9.22</li><li><b>FIB-4 = (55 × 65) / (180 × 9.22)</b></li><li>Numerator: 55 × 65 = 3,575</li><li>Denominator: 180 × 9.22 = 1,659.6</li><li><b>FIB-4 = 3,575 / 1,659.6 ≈ 2.15</b></li></ul><p><b>Interpretation:</b> FIB-4 2.15 falls in the indeterminate zone (1.3–2.67). Reassuring that not in high-risk category, but further evaluation recommended: transient elastography to estimate liver stiffness, or close follow-up with repeat labs in 6–12 months. No immediate biopsy indicated, but monitoring for progression is warranted.</p>'},
      {h: 'Management & Therapeutic Approach', body: '<p>No FDA-approved therapy specifically for NASH; management focuses on metabolic optimization. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Lifestyle interventions (first-line):</b> Weight loss ≥5–10% improves steatosis; 15% may improve histology in NASH</li><li><b>Glycemic control:</b> Management of T2DM reduces fibrosis progression</li><li><b>Dyslipidemia:</b> Statins for cardiovascular protection; no direct NASH benefit proven</li><li><b>Pioglitazone:</b> Improves NASH histology in select patients (diabetic NASH); weight gain side effect</li><li><b>Vitamin E (800 IU/day):</b> May benefit non-diabetic NASH patients; limited data</li><li><b>Emerging agents:</b> FXR agonists, GLP-1 agonists, PPAR-δ agonists under investigation</li></ul>'},
    ]},
    {key: 'quiz', label: 'Knowledge Check', type: 'quiz'},
    {key: 'checklist', label: 'Assessment', type: 'checklist'},
  ]
});

      {h: 'Primary Biliary Cholangitis (PBC)', body: '<p>PBC is an autoimmune cholestasis primarily affecting small/medium intrahepatic bile ducts. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Epidemiology:</b> Female predominance (>90% female); median age 50–60 years at diagnosis</li><li><b>Serology:</b> AMA (anti-mitochondrial antibody) positive in ~95% of PBC patients; highly specific</li><li><b>Autoantigen:</b> AMA recognizes pyruvate dehydrogenase complex (PDC-E2); other mitochondrial components also targeted</li><li><b>Pathology:</b> Lymphocytic infiltration of bile duct epithelium; bile duct loss; cholestasis; eventual fibrosis/cirrhosis</li><li><b>Cholangiocarcinoma risk:</b> Lower than PSC; <1–2% lifetime</li><li><b>IBD association:</b> NOT associated with PBC (unlike PSC)</li></ul>'},
      {h: 'Primary Sclerosing Cholangitis (PSC)', body: '<p>PSC is a chronic cholestasis characterized by stricturing and fibrosis of intra- and extrahepatic bile ducts. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Epidemiology:</b> Male predominance (male:female ~2:1); median age 40 years; higher incidence in Northern Europe/North America</li><li><b>Serology:</b> AMA typically NEGATIVE; pANCA may be positive (~70%) but non-specific</li><li><b>IBD association:</b> ~70–80% of PSC patients have concurrent ulcerative colitis (or less commonly Crohn disease); critical distinguishing feature</li><li><b>Pathology:</b> Concentric fibrosis of bile ducts ("onion-skinning"); progressive stricturing; leads to cholestasis, cirrhosis, cholangiocarcinoma</li><li><b>Cholangiocarcinoma risk:</b> 10–15% lifetime risk (much higher than PBC); active surveillance indicated</li><li><b>Imaging hallmark:</b> Cholangiography shows "beads on a string" appearance (alternating strictures and dilations)</li></ul>'},

      {h: 'Medical Therapy & Transplant Indications', body: '<p><b>PBC Treatment:</b> <span class="tag est">EST</span> Ursodeoxycholic acid (UDCA) 13–15 mg/kg/day is first-line; slows disease progression and delays transplantation. Symptomatic management of pruritus (cholestyramine, ursodiol, opioid antagonists). Bone health monitoring (osteoporosis risk).</p><p><b>PSC Treatment:</b> <span class="tag est">EST</span> No proven disease-modifying therapy. UDCA high-dose studied but no clear benefit. Management focuses on complications (cholangitis, cholangiocarcinoma screening, immunosuppression for IBD component). Liver transplantation is only definitive therapy for advanced disease.</p><p><b>Transplant Indications (both PBC & PSC):</b> <span class="tag est">EST</span> Decompensated cirrhosis (ascites, hepatic encephalopathy, variceal bleeding), MELD >15, or recurrent/uncontrolled cholangitis (PSC). Recurrence post-transplant is possible (especially PBC).</p>'},

    {h: 'Lauren Classification', body: '<p>Histopathologic classification dividing gastric cancer into two major types based on differentiation and growth pattern. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Intestinal-type (~50–60%):</b> Well-differentiated to moderately differentiated; forms glands/tubules; often arises from intestinal metaplasia (IM)</li><li><b>Diffuse-type (~30–40%):</b> Poorly differentiated/undifferentiated; signet-ring cells (mucin-filled cells with eccentrically displaced nuclei); infiltrates diffusely without mass formation; carries worse prognosis (5-year survival intestinal ~40%, diffuse ~15–20%)</li><li><b>Mixed type (~10%):</b> Elements of both patterns; prognosis intermediate</li><li><b>Clinical correlation:</b> Diffuse type is more likely to present at advanced stage; intestinal type often preceded by chronic gastritis/IM progression</li></ul>'},
    {h: 'Risk Factors & H. pylori', body: '<p>Helicobacter pylori infection is the dominant risk factor globally, responsible for ~75–90% of gastric adenocarcinomas in endemic regions. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>H. pylori mechanism:</b> Chronic inflammation → gastric atrophy → intestinal metaplasia → dysplasia → cancer (Correa cascade over 10–20 years)</li><li><b>Other risk factors:</b> Smoking, alcohol, family history, pernicious anemia (vitamin B12 deficiency), previous partial gastrectomy (Billroth II), smoking + alcohol synergy</li><li><b>Screening in endemic regions:</b> Some countries (Japan, South Korea) employ H. pylori serology + endoscopy screening; eradication therapy reduces cancer risk ~1% per year (NNT ~100–200 for prevention)</li></ul>'},
    {h: 'Hereditary Diffuse Gastric Cancer (HDGC)', body: '<p>Rare familial syndrome (~1–3% of gastric cancers) characterized by CDH1 gene mutations (encoding E-cadherin, a cell-adhesion protein). <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Genetics:</b> CDH1 mutations inherited in autosomal dominant pattern; penetrance ~40–50% by age 80; diffuse-type (signet-ring) phenotype</li><li><b>Clinical features:</b> Early age of onset (20–40 years typical), family history of gastric cancer (≥2 relatives affected) or diffuse gastric cancer + lobular breast cancer in family</li><li><b>Surveillance & prevention:</b> Annual endoscopy with biopsies starting in 20s; if CDH1 mutation confirmed + family history strong, prophylactic total gastrectomy considered (40–50% lifetime risk)</li></ul>'},
    {h: 'TNM Staging for Gastric Cancer', body: '<p>AJCC staging system analogous to esophageal cancer; T stage (depth) and N stage (node number) are strongest prognostic factors. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>T stage:</b> T1 (mucosa/submucosa; T1a = mucosa, T1b = submucosa), T2 (muscularis), T3 (subserosa), T4 (serosa; T4a = visceral peritoneum, T4b = adjacent structures)</li><li><b>N stage:</b> N0 (0 nodes), N1 (1–2 nodes), N2 (3–6 nodes), N3 (≥7 nodes); higher N stage worsens prognosis significantly</li><li><b>Stage groups:</b> Stage I (T1 + N0 or T1 + N1) → ~50–60% 5-yr survival; Stage IV (T4b or M1) → <10% 5-yr survival</li></ul>'},

  tabs: [{key: 'panc', label: 'Pancreatic Cancer Risk & Surveillance', type: 'accordion', data: [
    {h: 'Risk Factors & Etiology', body: '<p>Pancreatic adenocarcinoma is highly aggressive with 5-year survival ~10% overall; identifying high-risk individuals enables preventive surveillance. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Modifiable risk factors:</b> Smoking (~20% attributable risk), obesity, diabetes (bidirectional: DM increases risk; cancer causes DM)</li><li><b>Non-modifiable:</b> Age (peak 60–70), male sex, family history (2–7 fold increased risk with first-degree relative affected)</li><li><b>Chronic pancreatitis (Module 7e):</b> ~5–10% lifetime risk of pancreatic cancer; likely multifactorial (inflammation + ductal obstruction + carcinogenic metabolites)</li><li><b>Genetic syndromes:</b> BRCA2 (~5–10 fold risk), Lynch (Lynch syndrome; ~3–4 fold), Peutz-Jeghers (STK11 mutation; ~100–600 fold), hereditary pancreatitis (PRSS1/SPINK1; ~50–75 fold)</li></ul>'},
    {h: 'Why Early Detection Fails', body: '<p>Pancreatic cancer is uniquely challenging for early detection due to anatomic and biological factors. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Anatomy:</b> Retroperitoneal location; tumors grow silently without early mass effect or obstruction</li><li><b>Early symptoms:</b> Vague (dyspepsia, fatigue, back pain); often attributed to other causes; rarely prompt evaluation</li><li><b>Late presentation:</b> ~85% present with locally advanced or metastatic disease; jaundice (from head tumors) is late finding</li><li><b>Biomarkers:</b> CA 19-9 elevated in ~70% at diagnosis but not specific (elevated in benign chronic pancreatitis, gastric cancer); no sensitive early-stage biomarker</li><li><b>No general-population screening:</b> Endoscopic ultrasound (EUS) or MRI in asymptomatic populations not shown to improve outcomes; cost/harm of false positives exceeds benefit</li></ul>'},
    {h: 'High-Risk Surveillance Protocols', body: '<p>Patients with strong family history or hereditary syndromes benefit from structured imaging surveillance to enable earlier detection and surgical candidacy. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Eligibility criteria:</b> ≥2 affected first-degree relatives OR single relative <50 yrs at diagnosis OR hereditary syndrome (BRCA2, Lynch, Peutz-Jeghers, hereditary pancreatitis) confirmed</li><li><b>Surveillance modalities:</b> MRI/MRCP (non-invasive, good for duct visualization) or EUS (higher sensitivity for small lesions, allows tissue sampling if abnormality found); alternated yearly or every 6 months depending on risk</li><li><b>Screening intervals:</b> Annual starting age 40–45 (or 5–10 years before earliest family cancer) in high-risk families; earlier/more frequent for very high risk (hereditary pancreatitis, Peutz-Jeghers)</li><li><b>Outcome:</b> Surveillance enables detection of small, potentially resectable lesions (cystic neoplasms, pancreatic intraepithelial neoplasia grade 3/PanIN-3, early invasive tumors) before metastatic spread</li></ul>'},
    {h: 'TNM Staging & Resectability', body: '<p>Pancreatic cancer staging is prognostically important; resectability (ability to achieve R0 resection) is the most significant factor for improved survival. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>T stage:</b> T1 (≤2 cm, confined to pancreas), T2 (>2 cm, confined), T3 (invades beyond pancreas without celiac axis/SMA involvement), T4 (involves major vascular structures — unresectable)</li><li><b>Resectability assessment:</b> CT imaging evaluates involvement of superior mesenteric artery (SMA), portal vein, celiac axis; involvement = locally advanced (LAPC), precluding surgery</li><li><b>M status:</b> M1 (distant metastasis) = Stage IV; palliative chemotherapy considered (gemcitabine + abraxane or FOLFIRINOX)</li><li><b>Prognosis:</b> Resected Stage I-III: 5-year survival ~20–40%; unresectable/metastatic: <5% 5-year survival</li></ul>'},

registerStation('8d', {
  title: 'Colorectal Cancer: Molecular Classification & Microsatellite Status',
  objectives: [
    'Distinguish chromosomal instability (CIN) pathway (75% of sporadic CRC) from microsatellite instability (MSI) pathway (15%) and CpG island methylator phenotype (CIMP; 10%)',
    'Explain molecular mechanisms: CIN arises from APC mutations + chromosomal aneuploidy; MSI from mismatch-repair (MMR) gene defects or Lynch syndrome (cross-reference Module 3e)',
    'Apply MSI testing implications: MSI-high (dMMR) status predicts immunotherapy eligibility (checkpoint inhibitor response); lynch syndrome screening triggers familial surveillance (Module 3e)',
    'Recognize clinical correlation: MSI-high tumors often right-sided (proximal colon), earlier age of onset in Lynch syndrome, better response to immunotherapy despite worse prognosis in metastatic setting (paradox resolved by immune biology)',
    'Assess CRC screening and surveillance strategies: risk stratification (average vs. increased vs. high-risk per Module 3d); Lynch/FAP management per Module 3e'
  ],
  tabs: [{key: 'crcmol', label: 'CRC Molecular Pathways & Immunotherapy', type: 'accordion', data: [
    {h: 'CRC Molecular Classification', body: '<p>Sporadic colorectal cancer arises via three distinct molecular pathways; understanding the pathway predicts prognosis and therapy response. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Chromosomal Instability (CIN) pathway (~75%):</b> APC mutation → KRAS activation → TP53 loss (adenoma-carcinoma sequence Module 3c); leads to aneuploidy; primarily left-sided (distal colon/rectum); associated with Wnt and MAPK pathway activation</li><li><b>Microsatellite Instability (MSI) pathway (~15%):</b> Mismatch-repair (MMR) gene loss (MLH1, MSH2, MSH6, PMS2) or Lynch syndrome germline mutations; results in hypermutation phenotype (hundreds to thousands of point mutations); often right-sided (proximal colon); better immune infiltration</li><li><b>CpG Island Methylator Phenotype (CIMP) (~10%):</b> Epigenetic silencing of CpG islands (methylation); often involves MLH1 methylation + BRAF V600E mutation; intermediate pathway; typically right-sided; often MSI-high phenotype overlap</li></ul>'},
    {h: 'Microsatellite Instability (MSI) Testing & Lynch Syndrome', body: '<p>MSI testing identifies tumors with defective DNA mismatch repair; high MSI (dMMR) status has profound implications for staging, surveillance, and systemic therapy. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>MSI testing methods:</b> PCR-based microsatellite panel (5 markers) or immunohistochemistry (IHC) for MLH1/MSH2/MSH6/PMS2 proteins; high MSI (≥2 of 5 markers unstable) = dMMR phenotype</li><li><b>Etiologies of MSI-high:</b> Lynch syndrome (germline MMR mutations; ~2–3% of CRC) or sporadic MLH1 methylation (~15% of CRC)</li><li><b>Lynch syndrome (cross-reference Module 3e):</b> Germline mutations in MLH1, MSH2, MSH6, PMS2, or EPCAM; ~70–80% lifetime CRC risk; increased extracolonic cancer risk (endometrial, ovarian, gastric)</li><li><b>Universal screening:</b> All CRC should undergo MSI/dMMR testing (at diagnosis or on resected specimen); Lynch syndrome referral if MSI-high and age <70 or strong family history</li></ul>'},
    {h: 'MSI Status & Immunotherapy Response', body: '<p>MSI-high (dMMR) CRC tumors have high somatic mutation burden, increased neoantigens, and robust immune infiltration — enabling remarkable response to checkpoint inhibitors. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Immunotherapy in MSI-high CRC:</b> Checkpoint inhibitors (anti-PD-1: pembrolizumab, nivolumab; anti-CTLA-4: ipilimumab) show ~40–50% response rates in metastatic MSI-high CRC, compared to <5% in MSI-stable (pMMR) CRC</li><li><b>Clinical use:</b> MSI-high metastatic CRC: anti-PD-1 monotherapy or PD-1 + CTLA-4 inhibition approved first-line (improved overall survival vs chemotherapy)</li><li><b>Paradox resolved:</b> MSI-high CRC has worse traditional chemotherapy response and prognosis in stage III-IV (higher aggressive biology), BUT superior immunotherapy response due to neoantigen load and immune infiltration</li><li><b>Stage-dependent consideration:</b> Adjuvant immunotherapy (atezolizumab + bevacizumab) emerging for stage II-III MSI-high CRC with high-risk features (poor differentiation, MSI-high alone may not mandate adjuvant therapy outside high-risk context)</li></ul>'},
    {h: 'Clinical Correlation: Right-Sided vs Left-Sided CRC', body: '<p>Site of origin (anatomic location) correlates with molecular pathway and prognosis; right-sided tumors disproportionately MSI/CIMP. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Right-sided (proximal) CRC:</b> MSI-high more common (~25–30% vs 5–10% left-sided); CIMP phenotype enriched; often BRAF V600E mutated; generally worse prognosis; later presentation (vague symptoms, occult bleeding); higher female predominance</li><li><b>Left-sided (distal) CRC:</b> CIN pathway predominant; KRAS/TP53 mutations typical; earlier detection (alarm symptoms: change in bowel habits, overt hematochezia); better prognosis stage-for-stage in some analyses</li><li><b>Screening implications:</b> Right-sided proximal lesions missed by sigmoidoscopy alone; colonoscopy mandatory for complete evaluation</li></ul>'},
  ]}, {key: 'quiz', label: 'Knowledge Check', type: 'quiz'}, {key: 'checklist', label: 'Assessment', type: 'checklist'}]
});

    'Apply BCLC staging system (Barcelona Clinic Liver Cancer — cross-reference Module 6e for detailed review; summarize here) to prognosticate and guide treatment (resection vs. transplant vs. locoregional vs. sorafenib)',

    'Assess molecular profiling for targeted therapy: ActivinA pathway dysregulation, TERT promoter mutations, TP53 alterations predicting response to kinase inhibitors (sorafenib, lenvatinib, atezolizumab)',
    'Apply HCC surveillance protocols in cirrhotic patients (cross-reference Module 6e): ultrasound ± AFP every 3-6 months for at-risk cirrhotic patients; treatment escalation based on BCLC stage'
  ],
  tabs: [{key: 'hccmol', label: 'HCC Molecular Subtypes & Staging', type: 'accordion', data: [
    {h: 'HCC Molecular Subtypes & Prognosis', body: '<p>Hepatocellular carcinoma exhibits distinct molecular phenotypes with prognostic and therapeutic implications; molecular profiling increasingly guides systemic therapy selection. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Proliferative subtype:</b> High Wnt/β-catenin pathway activation (CTNNB1 mutations, APC loss); increased genomic instability; rapid growth; worse overall survival; enriched in advanced HCC (BCLC C/D)</li><li><b>Non-proliferative subtype:</b> Metabolic dysfunction, TERT promoter mutations without Wnt activation; better differentiation; slower growth; better response to sorafenib and other kinase inhibitors</li><li><b>Immune-enriched:</b> Emerging subtype with high immune infiltration (TILs); potential PD-1/PD-L1 immunotherapy response; increasingly recognized in advanced HCC</li><li><b>Therapeutic correlation:</b> Proliferative HCC has worse prognosis but may respond differently to immunotherapy; non-proliferative HCC responds better to TKIs; precision medicine approaches emerging</li></ul>'},
    {h: 'BCLC Staging System (Cross-Reference Module 6e)', body: '<p>Barcelona Clinic Liver Cancer (BCLC) is the most clinically useful prognostic and therapeutic staging system for HCC; integrates tumor burden, liver function (Child-Pugh), and performance status. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Stage 0 (Very early):</b> Single nodule <2 cm, Child-Pugh A; curative resection/transplant/ablation; 5-yr survival ~60–70%</li><li><b>Stage A (Early):</b> Single 2–5 cm OR ≤3 nodules <3 cm, Child-Pugh A-B; resection/transplant/TACE; 5-yr survival ~50–55%</li><li><b>Stage B (Intermediate):</b> Multinodular disease (>3 lesions or >5 cm total), no vascular invasion, no extrahepatic disease, Child-Pugh A-B; TACE preferred; 5-yr survival ~15–30%</li><li><b>Stage C (Advanced):</b> Vascular invasion or extrahepatic disease, Child-Pugh A-B; systemic therapy (sorafenib, atezolizumab + bevacizumab, lenvatinib); 5-yr survival ~2–10%</li><li><b>Stage D (Terminal):</b> Child-Pugh C or performance status 3–4; supportive care; median survival <3 months</li><li><b>Treatment by stage:</b> Stage 0/A: resection/OLT/ablation (curative intent); Stage B: TACE (locoregional); Stage C/D: systemic therapy or supportive care (detailed in Module 6e)</li></ul>'},
    {h: 'TNM Staging vs BCLC', body: '<p>AJCC TNM staging is anatomically precise but less clinically predictive than BCLC for HCC; TNM is often used alongside BCLC for research/registry purposes. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>T stage (tumor extent):</b> T1 (single <2 cm or single 2–5 cm), T2 (single 2–5 cm with vascular invasion OR ≤3 nodules all <3 cm), T3 (single >5 cm with vascular invasion OR >3 nodules; OR >5 cm without vascular invasion), T4 (vascular invasion with any size/number OR peritoneal invasion)</li><li><b>N stage:</b> N0 (no regional LN) vs N1 (regional LN metastasis); regional nodes are hilar/portahepatic; N1 is rare in HCC</li><li><b>M stage:</b> M0 (no extrahepatic disease) vs M1 (extrahepatic metastasis — lung, bone, adrenal, etc.)</li><li><b>Clinical utility:</b> BCLC better predicts outcomes and guides treatment; TNM more standardized across cancer types but less sensitive to liver dysfunction and performance status in HCC</li></ul>'},
    {h: 'HCC Surveillance & Molecular Profiling', body: '<p>HCC surveillance in cirrhotic patients enables earlier detection and curative treatment; molecular profiling guides systemic therapy selection in advanced HCC. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Surveillance protocols (Module 6e cross-reference):</b> Ultrasound ± AFP every 3–6 months in cirrhotic patients (regardless of etiology); stratified by HBsAg status, cirrhosis severity; APRI/FIB-4 scores may identify very low-risk patients (rare surveillance benefit)</li><li><b>Molecular testing in advanced HCC:</b> TERT promoter mutations (favorable response to TKI), TP53/CTNNB1 mutations (proliferative phenotype, worse prognosis), PD-L1 expression (potential immunotherapy response); increasingly available via liquid biopsy or tissue NGS panels</li><li><b>Targeted therapy selection:</b> TERT promoter wild-type + good performance: sorafenib or lenvatinib preferred; TP53 mutant: emerging data suggests lenvatinib efficacy; CTNNB1 activation: may predict poor TKI response but immunotherapy investigation ongoing</li><li><b>Immunotherapy emerging:</b> Atezolizumab (anti-PD-L1) + bevacizumab for advanced HCC approved first-line (BCLC C); PD-1 inhibitors (nivolumab, pembrolizumab) in development; molecular profiling may eventually guide immunotherapy selection</li></ul>'},
  ]}, {key: 'quiz', label: 'Knowledge Check', type: 'quiz'}, {key: 'checklist', label: 'Assessment', type: 'checklist'}]
});

registerStation('9a', {
  title: 'Swallowing Physiology & Oropharyngeal Dysfunction',
  objectives: [
    'Describe normal swallowing phases: oral (voluntary, tongue propulsion), pharyngeal (involuntary, airway closure, laryngeal elevation), esophageal (peristalsis via vagal innervation)',
    'Recognize oropharyngeal dysfunction causes: neurologic (stroke, Parkinson\'s disease, amyotrophic lateral sclerosis/ALS, myasthenia gravis) vs structural (Zenker\'s diverticulum, webs, strictures)',
    'Assess aspiration risk: dysphagia with cough during swallow, wet voice, nasal regurgitation, pneumonia history; indirect signs in neurologic disease',
    'Apply diagnostic approach: clinical history + bedside testing (water swallow), videofluoroscopic swallowing study (VFSS) gold standard for aspiration risk and phase localization',
    'Explain management: swallowing strategies (head posture modifications), dietary texture modification (thickened liquids, soft solids), speech-language pathology consultation, PEG consideration in severe cases'
  ],
  tabs: [{key: 'swall', label: 'Swallowing & Aspiration', type: 'accordion', data: [
    {h: 'Normal Swallowing Phases', body: '<p>Swallowing is a coordinated 3-phase process; disruption at any phase causes dysfunction and aspiration risk. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Oral phase (voluntary):</b> Lips seal, tongue propels bolus posteriorly against palate; intrinsic tongue muscles drive movement; lasts ~1 second</li><li><b>Pharyngeal phase (involuntary):</b> Soft palate elevates (nasopharyngeal closure), larynx elevates + epiglottis folds (airway protection), cricopharyngeus (upper esophageal sphincter) relaxes; bolus propelled by pharyngeal muscle contraction; lasts ~1 second</li><li><b>Esophageal phase (involuntary):</b> Primary peristalsis (vagal innervation CN X) propels bolus down esophagus; gravity + esophageal contractions; LES relaxes + opens; takes ~5–10 seconds to reach stomach</li></ul>'},
    {h: 'Oropharyngeal Dysfunction: Neurologic vs Structural', body: '<p>Oropharyngeal dysphagia results from disruption of the precise coordination required for safe swallowing. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Neurologic causes:</b> Stroke (most common; affects pharyngeal phase via CN X/XII dysfunction), Parkinson\'s disease (bradykinesia + rigidity of swallowing muscles), ALS (progressive motor neuron loss; severe aspiration risk), myasthenia gravis (fatigable pharyngeal weakness), multiple sclerosis, Guillain-Barré syndrome</li><li><b>Structural causes:</b> Zenker\'s diverticulum (pharyngeal outpouching; trapping of food; sensation of regurgitation hours after eating), postcricoid webs, head/neck cancer post-radiation/surgery, laryngeal stenosis</li><li><b>Clinical correlation:</b> Neurologic dysfunction is more common; structural abnormalities typically present with solid food dysphagia more than liquids</li></ul>'},
    {h: 'Aspiration Risk Assessment', body: '<p>Aspiration — entry of material into the airway below the vocal cords — is the major complication of oropharyngeal dysphagia. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Clinical signs of aspiration:</b> Cough during or immediately after swallow, wet voice (gurgly quality post-swallow), nasal regurgitation, fever/recurrent pneumonia (silent aspiration)</li><li><b>Silent aspiration:</b> Aspiration without cough reflex (common in elderly, neurologic disease); detected only by VFSS — high mortality risk</li><li><b>Risk factors:</b> Altered consciousness, severe dysphagia severity, multiple swallows per bolus, cough ineffectiveness</li><li><b>Consequences:</b> Aspiration pneumonia (anaerobic bacteria from oropharynx), malnutrition (fear of eating), dehydration</li></ul>'},
    {h: 'Diagnostic Approach & Management', body: '<p>VFSS is the gold standard for assessing aspiration risk and localizing dysphagia; management is largely conservative with close monitoring. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Bedside assessment:</b> History + observation (drooling, wet voice, cough); water-swallow test (cough during/after); NOT sensitive for aspiration alone</li><li><b>VFSS (videofluoroscopic swallowing study):</b> Real-time fluoroscopy with varied bolus consistencies (thin liquid, nectar, puree); gold standard for detecting aspiration and penetration (material entering larynx but not past vocal cords)</li><li><b>Management (conservative):</b> Swallowing strategies (head turn, chin-tuck, super-supraglottic swallow); diet texture modification (thickened liquids, puree/soft solids); SLP (speech-language pathology) consultation for adaptive techniques</li><li><b>Nutritional support:</b> If severe dysphagia: enteral feeding (NG tube short-term; PEG long-term if >2–4 weeks); consider prognosis (stroke survivors may recover over weeks–months)</li></ul>'},
  ]}, {key: 'quiz', label: 'Knowledge Check', type: 'quiz'}, {key: 'checklist', label: 'Assessment', type: 'checklist'}]
});

registerStation('9b', {
  title: 'Achalasia & Chagas-Related Megaesophagus',
  objectives: [
    'Recognize achalasia pathophysiology: loss of inhibitory neurons (nitric oxide/GABA release) in myenteric plexus → LES failure to relax + absent esophageal peristalsis',
    'Distinguish primary (idiopathic) achalasia from secondary causes: Chagas disease (T. cruzi destroying myenteric neurons, endemic in Latin America), malignancy (pseudo-achalasia at GE junction)',
    'Assess achalasia severity and treatment options: pneumatic dilation vs laparoscopic Heller myotomy vs peroral endoscopic myotomy (POEM) — real, current treatment modalities',
    'Apply Chicago Classification v4.0 framework (manometry categories: achalasia Types I/II/III based on pattern); reference EUS-Manometry Navigator sibling for tracing interpretation details',
    'Explain Chagas disease epidemiology (T. cruzi transmission via reduviid bug; serology/culture for diagnosis) and clinical progression (acute myocarditis → chronic cardiomyopathy + megaesophagus/megacolon)'
  ],
  tabs: [{key: 'achal', label: 'Achalasia Pathophysiology & Treatment', type: 'accordion', data: [
    {h: 'Achalasia Pathophysiology', body: '<p>Achalasia is characterized by dysfunction of the lower esophageal sphincter (LES) due to selective loss of inhibitory neurons in the myenteric plexus. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Mechanism:</b> Loss of nitric oxide (NO)-producing and GABA-producing inhibitory neurons in myenteric plexus; prevents LES relaxation + abolishes esophageal primary peristalsis</li><li><b>Result:</b> LES remains tonically contracted; esophageal smooth muscle fails to propagate waves → dysphagia to solids AND liquids (progressive, both food/drink), regurgitation of undigested food, chest pain, weight loss</li><li><b>Etiology:</b> Primary (idiopathic) achalasia ~95%; autoimmune vs viral vs heritable components under investigation</li><li><b>Presention age:</b> Bimodal: 25–40 and 60+ years; rare in children</li></ul>'},
    {h: 'Secondary Achalasia: Chagas Disease', body: '<p>Chagas disease (American trypanosomiasis) caused by T. cruzi parasite destroys myenteric neurons, causing secondary achalasia and megaesophagus; geographically distinct from primary achalasia. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Epidemiology:</b> Endemic in Latin America (Mexico to Argentina); transmitted by reduviid bugs (kissing bug); rare in USA (travel-related or transfusion-related)</li><li><b>Chagas natural history:</b> Acute phase (fever, myocarditis, hepatosplenomegaly, rarely meningitis); chronic phase (indeterminate or symptomatic cardiomyopathy); GI manifestations emerge years–decades later</li><li><b>Megaesophagus/megacolon:</b> Chronic T. cruzi destroys myenteric plexus (neurons + glia); achalasia-like esophageal dysfunction + megaesophagus on imaging; similar dysphagia + regurgitation, but often with colon involvement (megacolon → severe constipation/toxic megacolon risk)</li><li><b>Diagnosis:</b> Serology (anti-T. cruzi antibodies; delayed in early acute phase); blood culture or xenodiagnosis (feeding bug larvae on patient blood)</li></ul>'},
    {h: 'Achalasia Treatment Options', body: '<p>Achalasia treatment is palliative (restores LES opening); three main modalities with distinct risk/benefit profiles. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Pneumatic dilation:</b> Forceful rupture of LES muscle fibers via high-pressure balloon; non-surgical, lower upfront cost; high (~90%) short-term response; recurrent dysphagia common (requires repeat dilation ~50% at 5 years); perforation risk ~2–3% (requires ICU/surgery if symptomatic)</li><li><b>Laparoscopic Heller myotomy (+ partial fundoplication):</b> Division of circular muscle fibers of LES; more durable (symptom relief persists >80% at 5–10 yrs); surgical risks (infection, bleeding); postoperative reflux common (~30%; mitigated by partial fundoplication)</li><li><b>POEM (peroral endoscopic myotomy):</b> Emerging technique; endoscopic tunneling + myotomy without external incision; early data promising (symptom relief ~90% at 1 year); long-term durability unknown; requires specialized expertise</li><li><b>Choice depends on:</b> Patient age/comorbidities, preference for repeated procedures vs surgery, availability of POEM expertise; younger patients often offered surgical myotomy for durability; older/high-risk patients may prefer dilation</li></ul>'},
    {h: 'Chicago Classification v4.0 — Achalasia Subtypes', body: '<p>Manometry classification distinguishes achalasia based on esophageal contraction patterns; detailed tracing interpretation is the domain of EUS-Manometry Navigator sibling app. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Type I (Classic):</b> Absent esophageal contractions + elevated median LES pressure; least aggressive phenotype; best prognosis with dilation/myotomy</li><li><b>Type II (With pressurization):</b> Absent peristalsis + intermittent esophageal pressurization (20–50% of swallows); intermediate phenotype; intermediate response to therapy</li><li><b>Type III (Spastic):</b> Absent normal peristalsis + rapid/premature contractions (>20% of swallows); most aggressive; worse response to dilation; often needs myotomy or POEM</li><li><b>For diagnostic tracing details and manometry criteria:</b> See EUS-Manometry Navigator (sibling application) which covers full Chicago v4.0 framework with interactive tracing examples</li></ul>'},
  ]}, {key: 'quiz', label: 'Knowledge Check', type: 'quiz'}, {key: 'checklist', label: 'Assessment', type: 'checklist'}]
});

registerStation('9c', {
  title: 'Diffuse Esophageal Spasm & Nutcracker Esophagus',
  objectives: [
    'Distinguish diffuse esophageal spasm (DES): uncoordinated contractions (premature/simultaneous/repetitive), preserved esophageal response to wet swallows',
    'Recognize hypercontractile/"nutcracker" esophagus: high-amplitude contractions (>220 mmHg distal wave amplitude per Chicago v4.0 definition), organized propagation preserved',
    'Assess clinical presentation: chest pain (non-cardiac, often mimics angina), dysphagia (intermittent, variable), regurgitation (less common than achalasia)',
    'Explain diagnostic approach: esophageal manometry (Chicago Classification framework — reference EUS-Manometry Navigator for tracing interpretation), endoscopy to exclude mechanical obstruction',

  ],
  tabs: [{key: 'des', label: 'Spastic Esophageal Disorders', type: 'accordion', data: [
    {h: 'Diffuse Esophageal Spasm (DES)', body: '<p>DES is characterized by uncoordinated, premature esophageal contractions without LES dysfunction; distinguished from achalasia by preserved peristaltic potential. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Manometry findings (Chicago v4.0):</b> ≥20% of contractions are premature (occur <4.5 seconds after swallow), or simultaneous, or repetitive (≥3 contractions per swallow); LES relaxation preserved</li><li><b>Pathophysiology:</b> Mechanism unclear; may involve altered Ca++ sensitivity in smooth muscle, abnormal interneuron signaling, or heightened neural sensitivity to mechanical stimuli</li><li><b>Clinical presentation:</b> Intermittent dysphagia (solid > liquid, variable day-to-day), chest pain (non-cardiac, often substernal, may radiate to back/arm — mimics angina), regurgitation (less common), possible food impaction episodes</li><li><b>Diagnosis:</b> Manometry gold standard (see EUS-Manometry Navigator for tracing interpretation); endoscopy normal (excludes mechanical obstruction)</li></ul>'},
    {h: 'Hypercontractile Esophagus (Nutcracker Esophagus)', body: '<p>Hypercontractile esophagus, formerly called "nutcracker," is characterized by very high-amplitude distal esophageal waves with preserved propagation. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Manometry findings (Chicago v4.0):</b> Mean distal contractile integral (DCI) ≥8000 mmHg-s-cm (or distal esophageal pressure amplitude >220 mmHg); normal propagation (hypercontractile, not spastic)</li><li><b>Clinical presentation:</b> Chest pain (often severe, non-cardiac, can mimic acute coronary syndrome); dysphagia (less common than pain); usually good esophageal transit (as opposed to DES where dysphagia is prominent)</li><li><b>Prognosis:</b> Often self-limited; some spontaneous resolution over years; less likely to evolve into achalasia vs DES</li><li><b>Diagnosis:</b> Manometry + endoscopy (normal); Chicago v4.0 criteria (see EUS-Manometry Navigator for full interpretation framework)</li></ul>'},
    {h: 'Clinical Presentation & Differential', body: '<p>Both DES and nutcracker present with chest pain and/or dysphagia; distinguishing features and cardiac workup are critical. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Chest pain similarity to angina:</b> DES/nutcracker chest pain is retrosternal, can radiate to back/arm/jaw, and may be exercise-triggered — mimicking coronary ischemia; EKG and troponin negative (key discriminator)</li><li><b>Dysphagia pattern:</b> DES dysphagia is variable + intermittent (not every swallow); nutcracker usually dysphagia-free or very mild; achalasia dysphagia is progressive + every meal</li><li><b>Regurgitation:</b> DES/nutcracker rare; achalasia common</li><li><b>Weight loss:</b> DES/nutcracker mild or none; achalasia progressive</li></ul>'},
    {h: 'Management Strategy', body: '<p>Pharmacotherapy is first-line for DES/nutcracker; surgical/endoscopic intervention rarely needed. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Smooth muscle relaxants:</b> Nitrates (isosorbide dinitrate long-acting, though tolerance develops), calcium channel blockers (diltiazem, nifedipine XL; modest efficacy ~30–50% symptom relief), phosphodiesterase inhibitors (sildenafil — emerging data)</li><li><b>Pain modulation:</b> Tricyclic antidepressants (desipramine 10–50 mg daily) — often most effective for DES chest pain, effect independent of mood; other antidepressants (SSRIs) less effective</li><li><b>Botulinum toxin injection:</b> Endoscopic injection of botulinum toxin into distal esophagus; reduces contraction amplitude; effect temporary (~3 months); reserved for refractory cases; no standard dosing/technique yet</li><li><b>Reassurance + lifestyle:</b> Stress/anxiety often exacerbate; reassurance that condition is benign (no malignancy risk) often provides relief; PPI trial if GERD suspected</li></ul>'},
  ]}, {key: 'quiz', label: 'Knowledge Check', type: 'quiz'}, {key: 'checklist', label: 'Assessment', type: 'checklist'}]
});

  tabs: [{key: 'gp', label: 'Gastroparesis Pathophysiology & Treatment', type: 'accordion', data: [
    {h: 'Gastroparesis Definition & Etiology', body: '<p>Gastroparesis (delayed gastric emptying) is a functional motility disorder WITHOUT mechanical obstruction; multiple etiologies with distinct pathophysiology. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Diabetic gastroparesis (~30–50% of GP cases):</b> Chronic hyperglycemia → autonomic neuropathy (vagal + parasympathetic dysfunction) + enteric neuropathy; impaired gastric accommodation + antral contractility; risk increases with diabetes duration + poor glycemic control</li><li><b>Idiopathic gastroparesis (~25–40%):</b> No identified etiology; may be post-viral (norovirus, rotavirus); autoimmune mechanisms (anti-ghrelin antibodies) emerging</li><li><b>Post-surgical (~10–15%):</b> Post-fundoplication (mechanical + denervation), post-vagotomy, post-RYGB (altered anatomy), gastric surgery complications</li><li><b>Other causes:</b> Paraneoplastic syndrome (lung/breast cancer), hypothyroidism, opioid medications (decrease antral contractions), anticholinergics</li></ul>'},
    {h: 'Pathophysiology of Gastric Dysfunction', body: '<p>Gastroparesis involves disrupted coordination of gastric smooth muscle and enteric nervous system; fundic, antral, and pyloric dysfunction all contribute. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Fundic (proximal) dysfunction:</b> Loss of normal accommodation (fundus should relax to receive meal); loss of resting tone; impaired meal distribution</li><li><b>Antral (distal) dysfunction:</b> Weak/uncoordinated contractions; loss of 3-per-minute rhythm (normal gastric pacemaker frequency); failure to grind/propel food</li><li><b>Pyloric dysfunction:</b> Inappropriate pyloric resistance (pyloric spasm) or incompetence; mismatch between antral propulsion + pyloric opening</li><li><b>Neurologic substrate:</b> Loss of inhibitory neurons (nitric oxide/VIP), impaired excitatory signaling (acetylcholine, substance P); autonomic imbalance</li></ul>'},
    {h: 'Diagnostic Approach: Gastric Emptying Scintigraphy', body: '<p>GES is the gold-standard diagnostic test for gastroparesis; endoscopy must exclude mechanical obstruction first. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Endoscopy (prerequisite):</b> Must exclude mechanical obstruction (gastric outlet obstruction, malignancy, pyloric stenosis, bezoars) before diagnosing functional gastroparesis</li><li><b>Gastric emptying scintigraphy (GES):</b> Patient eats low-fat meal labeled with Tc-99m sulfur colloid; serial imaging at 0, 1, 2, 3, 4 hours; measures percent retention of radioactivity</li><li><b>GES interpretation (American Neurogastroenterology Society guideline):</b> <span class="tag est">EST</span> Normal: <10% retention at 4 hours (or <25% at 2 hours on some protocols); mild delay: 10–15% at 4 hours; moderate: 15–35%; severe: >35%</li><li><b>Limitations:</b> GES measures only solid-phase emptying (not liquids, which empty differently); affected by meal composition, medications; poor standardization across centers</li></ul>'},
    {h: 'Management: Medical & Neuromodulation', body: '<p>Management escalates from dietary modification to pharmacotherapy to neuromodulation in refractory cases. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Dietary modification (first-line):</b> Small, frequent meals (4–6/day); low-fat diet (<7g fat/meal); soft/pureed foods; liquid meals in severe cases; hydration management</li><li><b>Pharmacotherapy:</b> Metoclopramide (dopamine antagonist, enhances acetylcholine effect; typical dose 10mg TID AC meals; max 30mg/day) — effective but MAJOR RISK: tardive dyskinesia with prolonged use (>3 months; risk ~1–2% per year); now recommended max 12 weeks; alternative: domperidone (peripheral dopamine antagonist, no CNS tardive dyskinesia risk, available outside USA)</li><li><b>Other agents (modest efficacy):</b> Domperidone (if available), prucalopride (5-HT4 agonist), acotiamide (acetylcholinesterase inhibitor; available in Asia/Europe)</li><li><b>Neuromodulation (refractory cases):</b> Gastric electrical stimulation (GES device — Enterra) implanted; high-frequency, low-amplitude electrical stimulation of gastric smooth muscle; provides 40–50% symptom improvement in ~60% of patients; requires laparoscopic implantation; not FDA-approved for newer versions yet</li></ul>'},
  ]}, {key: 'quiz', label: 'Knowledge Check', type: 'quiz'}, {key: 'checklist', label: 'Assessment', type: 'checklist'}]
});

registerStation('9e', {
  title: 'Functional Anorectal Disorders & Defecatory Dysfunction',
  objectives: [
    'Recognize functional anorectal disorders framework (Rome IV criteria — consistent with Module 2c/3b IBS Rome IV approach)',
    'Distinguish dyssynergic defecation: inappropriate contraction of pelvic floor/external anal sphincter during straining (paradoxical contraction); impaired relaxation',
    'Assess anorectal dysfunction: straining difficulty, incomplete evacuation sensation, digitation (manual disimpaction), prolonged time on toilet, hard stool consistency (IBS-C phenotype cross-reference Module 3b)',
    'Apply diagnostic approach: anorectal manometry (resting tone, squeeze pressure, rectal sensation thresholds, push maneuver to assess paradoxical contraction); defecography/dynamic MRI if needed',
    'Explain management: biofeedback therapy (train conscious relaxation of external anal sphincter during straining; efficacy ~60–80%), conservative measures (dietary fiber, fluid, timed bowel habits), rarely: surgical interventions (anismus rarely treated surgically)'
  ],
  tabs: [{key: 'arc', label: 'Anorectal Dysfunction & Management', type: 'accordion', data: [
    {h: 'Functional Anorectal Disorders: Rome IV Framework', body: '<p>Functional anorectal disorders are diagnosed via Rome IV criteria (consistent with Module 2c/3b IBS Rome framework); dyssynergic defecation is the most common. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Rome IV diagnostic criteria (dyssynergic defecation):</b> <span class="tag est">EST</span> Symptoms ≥25% of defecations (12+ weeks in past 12 months): (1) straining, AND (2) ≥2 of: sensation of incomplete evacuation, digitation requirement, hard/lumpy stool, prolonged time, or sensation of obstruction</li><li><b>Manometry confirmation:</b> Abnormal defecation pattern on manometry: either inadequate abdominal straining pressure (low push effort), OR inappropriate increase in anal sphincter pressure/contraction during defecation attempt (paradoxical contraction/anismus)</li><li><b>Prevalence:</b> Dyssynergic defecation affects ~25–30% of patients with functional constipation (Module 3b cross-reference)</li></ul>'},
    {h: 'Pelvic Floor Dysfunction & Paradoxical Contraction', body: '<p>Dyssynergic defecation results from paradoxical contraction or inadequate relaxation of the pelvic floor during straining. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Normal defecation mechanics:</b> Abdominal straining (Valsalva) ↓ intrarectal pressure; external anal sphincter + puborectalis relax (conscious, learned); rectum contracts; stool expelled</li><li><b>Paradoxical contraction (anismus):</b> During straining attempt, external anal sphincter contracts INSTEAD of relaxing; pelvic floor (puborectalis) fails to relax; mechanical obstruction to defecation</li><li><b>Inadequate straining:</b> Some patients fail to generate sufficient abdominal pressure (weak push effort); may be learned behavior or neurologic</li><li><b>Etiology unclear:</b> Possible learned maladaptive behavior (chronic straining for hard stool → pelvic floor guarding); anxiety; prior trauma/abuse; neurologic dysfunction</li></ul>'},
    {h: 'Clinical Presentation & Functional Impact', body: '<p>Dyssynergic defecation presents with straining difficulty, incomplete evacuation, and often requires manual disimpaction or prolonged toilet time. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Symptoms:</b> Excessive straining (often 15–30+ minutes on toilet), sensation of incomplete evacuation (need for repeated attempts), hard/lumpy stool (poor colonic water absorption or IBS-C overlap), digitation (must insert fingers to help evacuate stool)</li><li><b>Associated features:</b> Abdominal bloating (prolonged fecal stasis), occasional fecal incontinence (paradoxical, due to rectal fecal impaction above dysfunctional segment), pelvic pain/pressure</li><li><b>Impact on quality of life:</b> Significant; time commitment, embarrassment, social isolation; often leads to laxative overuse → dependency</li></ul>'},
    {h: 'Anorectal Manometry & Biofeedback Therapy', body: '<p>Anorectal manometry confirms dyssynergic defecation; biofeedback therapy is the evidence-based first-line treatment. <span class="tag est">EST</span></p><ul style="line-height:1.8;margin-left:20px;"><li><b>Anorectal manometry:</b> Measure resting anal sphincter pressure (normal ~50–80 mmHg), squeeze pressure (normal 100–180 mmHg), rectal sensation thresholds (normal threshold ~18–25 mL); PUSH maneuver: patient asked to strain/defecate; paradoxical rise in anal pressure indicates dyssynergic contraction</li><li><b>Biofeedback therapy (efficacy ~60–80%):</b> <span class="tag est">EST</span> Patient receives real-time visual/auditory feedback of anal sphincter pressure during simulated defecation; learns to consciously relax external anal sphincter while straining; typically 4–6 sessions with trained therapist (often SLP or PT); requires patient motivation + neuroplasticity capacity</li><li><b>Success factors:</b> Clear manometry diagnosis of dyssynergic pattern (paradoxical contraction); patient understanding + motivation; skilled biofeedback provider; younger age + shorter symptom duration associated with better outcomes</li><li><b>Defecography/dynamic MRI:</b> Visualizes anorectal anatomy during straining; shows puborectalis angle, perineal descent, intussusception; reserved for cases where anatomy (stricture, mass, pelvic floor prolapse) suspected</li></ul>'},
  ]}, {key: 'quiz', label: 'Knowledge Check', type: 'quiz'}, {key: 'checklist', label: 'Assessment', type: 'checklist'}]
});

  '4e': {groups: [{name:'Knowledge: Disease Activity vs. Independent Course', items:[['e1','Distinguishes manifestations that correlate with disease activity (erythema nodosum, peripheral arthritis) vs. independent course (PSC, AS, uveitis)'],['e2','Lists all major extraintestinal manifestations: erythema nodosum, pyoderma gangrenosum, uveitis, episcleritis, PSC, peripheral arthritis, AS/sacroiliitis, oral aphthae, anemia, osteoporosis, VTE'],]},{name:'Clinical: Management & Surveillance', items:[['m1','Knows erythema nodosum and peripheral arthritis resolve with IBD remission vs. PSC and AS requiring independent long-term management'],['m2','Explains PSC 10–15% cholangiocarcinoma risk and need for advanced imaging/surveillance'],['m3','Recognizes uveitis as medical emergency (refer to ophthalmology immediately) and ankylosing spondylitis as progressive, TNF-inhibitor-responsive axial arthritis'],]}]},
};

Object.assign(CHECKLISTS, CHECKLISTS_MOD4);

// ============ MODULE 5 CHECKLISTS ============
const CHECKLISTS_MOD5 = {
  '5a': {groups: [{name:'Knowledge: Viral Hepatitis Serology', items:[['s1','States anti-HAV IgM as marker of acute HAV; anti-HAV IgG as immunity/prior exposure'],['s2','Interprets HBsAg, anti-HBc IgM/IgG, anti-HBs patterns across acute/chronic/resolved/vaccinated states'],['s3','Applies HBeAg/anti-HBe dynamics to assess viral replication and infectivity'],['s4','Distinguishes HCV RNA (detectable early, confirms active infection) from anti-HCV antibody (delayed, may be negative in early acute)'],]},{name:'Clinical: Serologic Interpretation & Risk Assessment', items:[['c1','Applies serology panel to diagnose acute vs. chronic vs. resolved viral hepatitis'],['c2','Recognizes serologic window period (anti-HBc+ before anti-HBs appears) and its clinical significance'],['c3','Identifies fulminant hepatitis risk factors (age, superinfection, pregnancy in HEV, cirrhosis)'],]}]},
  '5b': {groups: [{name:'Knowledge: HBV Natural History & Phases', items:[['h1','Distinguishes HBeAg-positive (high viremia, high infectivity) from HBeAg-negative (lower viremia, slower progression) phases'],['h2','States spontaneous HBeAg clearance rate (~5–10% per year) and its prognostic implications'],['h3','Understands concept of treatment thresholds (ALT, HBV DNA, fibrosis) and their role in treatment decisions'],]},{name:'Clinical: Antiviral Therapy & Resistance', items:[['c1','Names first-line antivirals (tenofovir, entecavir) and compares to lamivudine (high resistance)'],['c2','Understands that chronic HBV typically requires indefinite therapy; discontinuation risks reactivation'],['c3','Applies treatment philosophy: consider therapy if cirrhosis present regardless of ALT/DNA, or if ALT elevated + high DNA + significant fibrosis'],]}]},
  '5c': {groups: [{name:'Knowledge: HCV Genotypes & DAA Therapy', items:[['h1','Classifies HCV into six major genotypes and recognizes genotype 1 prevalence in North America (~40–50%)'],['h2','Explains DAA mechanism: NS3/4A protease, NS5A, NS5B polymerase inhibition'],['h3','States modern DAA cure rates (>95% SVR across all genotypes) and treatment duration (8–12 weeks)'],]},{name:'Clinical: SVR & Cure Assessment', items:[['c1','Defines SVR12 as HCV RNA undetectable 12+ weeks post-treatment = functional cure'],['c2','Recognizes no sterilizing immunity post-cure; cured patients can become re-infected with new exposure'],['c3','Understands that cirrhosis status has minimal impact on modern DAA efficacy (>95% cure even in cirrhotic patients)'],]}]},
  '5d': {groups: [{name:'Knowledge: NAFLD Spectrum & FIB-4 Index', items:[['n1','Defines simple steatosis vs. NASH and recognizes most NAFLD patients have low fibrosis progression risk'],['n2','Computes FIB-4 index from age, AST, ALT, platelets with correct formula: (Age × AST) / (Platelets × √ALT)'],['n3','Applies FIB-4 interpretation cutoffs (low <1.3, high >2.67, indeterminate in-between) with awareness that exact thresholds vary slightly by guideline'],]},{name:'Clinical: NAFLD Management & Metabolic Risk', items:[['c1','Identifies metabolic risk factors for NAFLD (obesity, T2DM, dyslipidemia, metabolic syndrome)'],['c2','Applies management: weight loss ≥5%, glycemic control, statins, pioglitazone/vitamin E in select cases'],['c3','Recognizes no FDA-approved NASH-specific therapy yet; emphasis on lifestyle and metabolic optimization'],]}]},

};

Object.assign(CHECKLISTS, CHECKLISTS_MOD5);

/* =========================================================================
   NORMALIZE STATIONS — surface authored content that had no tab wired in.
   Every station has a quiz; competency checklists were authored for all 47
   but only tabbed into modules 4/5/7/8/9. Add the missing tabs from data
   so the 22 checklists in modules 1/2/3/6 become reachable, and guarantee
   a quiz tab wherever quiz data exists. Type-based, so it never duplicates
   a tab a station already declares.
   ========================================================================= */
function normalizeStations(){
  Object.keys(STATION_CONFIG).forEach(code=>{
    const cfg = STATION_CONFIG[code];
    if(!cfg || !Array.isArray(cfg.tabs)) return;
    const hasType = t => cfg.tabs.some(tab=>tab.type===t);
    if(QUIZZES[code] && !hasType('quiz'))
      cfg.tabs.push({key:'quiz', label:'Knowledge Check', type:'quiz'});
    if(CHECKLISTS[code] && !hasType('checklist'))
      cfg.tabs.push({key:'chk', label:'Competency Checklist', type:'checklist'});
  });
}

/* ---- keyboard navigation: ← / → move between stations ---- */
function currentStationCode(){
  const p = (window.location.hash||'').split('/');
  return (p[1]==='station' && p[2]) ? p[2] : null;
}
document.addEventListener('keydown', e=>{
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||e.target.isContentEditable) return;
  const code = currentStationCode();
  if(!code) return;
  if(e.key==='ArrowRight'){ const n=neighborStations(code).next; if(n){ location.hash='#/station/'+n.code; } }
  else if(e.key==='ArrowLeft'){ const pnb=neighborStations(code).prev; if(pnb){ location.hash='#/station/'+pnb.code; } }
});

/* ---- mobile sidebar + search + reset wiring ---- */
function closeSidebar(){ document.body.classList.remove('nav-open'); }
function initChrome(){
  const toggle = document.getElementById('menuToggle');
  const backdrop = document.getElementById('navBackdrop');
  if(toggle) toggle.addEventListener('click', ()=>document.body.classList.toggle('nav-open'));
  if(backdrop) backdrop.addEventListener('click', closeSidebar);
  const search = document.getElementById('navSearch');
  if(search) search.addEventListener('input', applyNavFilter);
  const reset = document.getElementById('resetProgress');
  if(reset) reset.addEventListener('click', ()=>{
    if(confirm('Reset all visited/quiz/checklist progress on this device? This cannot be undone.')){
      resetProgress();
      renderPage(window.location.hash);
    }
  });
  // close the mobile drawer whenever a station link is tapped
  document.getElementById('navTree').addEventListener('click', e=>{
    if(e.target.closest('.station-link')) closeSidebar();
  });
}

normalizeStations();
window.addEventListener('hashchange', ()=>renderPage(window.location.hash));
document.addEventListener('DOMContentLoaded', ()=>{ initChrome(); renderPage(window.location.hash); });
</script>
